<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HERO 체크인</title>
<style>
  /* 코치용 사이트와 같은 색을 써서 같은 서비스라는 느낌을 준다 */
  :root{ --bg:#12151c; --surface:#1a1f29; --line:#2b3242; --text:#fff; --muted:#aab2c5; --lime:#c6ff3d; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system, 'Apple SD Gothic Neo', sans-serif; }
  .screen{ max-width:420px; margin:0 auto; padding:calc(48px + env(safe-area-inset-top)) 20px 32px; }
  .hidden{ display:none; }
  h1{ font-size:24px; margin:0 0 8px; }
  p{ color:var(--muted); line-height:1.6; margin:0 0 24px; }
  button{ width:100%; height:52px; border:none; border-radius:12px; background:var(--lime); color:#0d1a03; font-size:16px; font-weight:700; cursor:pointer; }
  input{ width:100%; height:52px; margin-bottom:12px; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:18px; letter-spacing:4px; text-align:center; }
  .err{ color:#ff6b5a; font-size:14px; min-height:20px; margin-top:12px; }
  .link{ background:none; height:auto; color:var(--muted); font-size:14px; font-weight:400; margin-top:16px; text-decoration:underline; }
  .box{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; color:var(--muted); }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-firestore-compat.min.js"></script>
</head>
<body>

<!-- 화면 0: 로딩 (로그인 확인 중) -->
<section id="screen-loading" class="screen">
  <p>확인하는 중...</p>
</section>

<!-- 화면 1: 로그인 -->
<section id="screen-login" class="screen hidden">
  <h1>HERO 체크인</h1>
  <p>오늘 컨디션을 기록하려면 먼저 로그인하세요.</p>
  <button onclick="loginWithGoogle()">Google로 로그인</button>
  <div id="login-error" class="err"></div>
</section>

<!-- 화면 2: 초대 코드 입력 (처음 한 번만) -->
<section id="screen-code" class="screen hidden">
  <h1>초대 코드 입력</h1>
  <p id="user-email" style="color:var(--lime); margin-bottom:8px;"></p>
  <p>코치님께 받은 코드를 입력하면 내 기록과 연결돼요. 처음 한 번만 하면 됩니다.</p>
  <input id="code-input" maxlength="6" placeholder="코드 6자리">
  <button id="link-btn" onclick="linkStudent()">연결하기</button>
  <div id="code-error" class="err"></div>
  <button class="link" onclick="logout()">다른 계정으로 로그인</button>
</section>

<!-- 화면 3: 체크인 (2단계에서 채울 자리) -->
<section id="screen-checkin" class="screen hidden">
  <h1 id="checkin-title">오늘 체크인</h1>
  <p>여기에 체크인 질문이 들어갈 예정이에요.</p>
  <div class="box">2단계에서 만들 영역</div>
  <button class="link" onclick="logout()">로그아웃</button>
</section>

<script>
  // 화면 전환: 모든 화면을 숨긴 뒤, 보여줄 화면 하나만 보이게 한다
  function show(screenId){
    document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
    document.getElementById(screenId).classList.remove('hidden');
  }

  // ---- Firebase 연결 (코치용 사이트와 같은 프로젝트) ----
  firebase.initializeApp({
    apiKey: "AIzaSyAWKsdEXjM0vMT06wYht5kPmD6R9i1d0yA",
    authDomain: "hero-sports-academy.firebaseapp.com",
    projectId: "hero-sports-academy",
    appId: "1:505238936070:web:ab01e5164d03c44de0c187"
  });
  const auth = firebase.auth();

  // Google 로그인 팝업을 띄운다
  function loginWithGoogle(){
    document.getElementById('login-error').textContent = '';
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(err => {
      document.getElementById('login-error').textContent = '로그인 실패: ' + err.code;
    });
  }

  function logout(){ auth.signOut(); }

  // ---- Firestore 연결 ----
  const db = firebase.firestore();
  let myStudent = null; // 연결된 내 학생 정보 {id, name}

  // 이 계정(uid)이 이미 연결된 학생 문서를 찾는다
  async function findMyStudent(uid){
    const snap = await db.collection('students').where('uid', '==', uid).limit(1).get();
    if(snap.empty) return null;
    const doc = snap.docs[0];
    return { id: doc.id, name: doc.data().name };
  }

  function enterCheckin(student){
    myStudent = student;
    document.getElementById('checkin-title').textContent = student.name + '님, 오늘 체크인';
    show('screen-checkin');
  }

  // 초대 코드로 학생과 이 계정을 연결한다
  async function linkStudent(){
    const errBox = document.getElementById('code-error');
    const btn = document.getElementById('link-btn');
    const code = document.getElementById('code-input').value.trim().toUpperCase();
    errBox.textContent = '';
    if(!code){ errBox.textContent = '코드를 입력해 주세요.'; return; }
    btn.disabled = true;
    try{
      const uid = auth.currentUser.uid;
      const inviteRef = db.collection('invites').doc(code);
      const invite = await inviteRef.get();
      if(!invite.exists){ errBox.textContent = '없는 코드예요. 코치님께 다시 확인해 보세요.'; return; }
      const inv = invite.data();
      if(inv.usedBy && inv.usedBy !== uid){ errBox.textContent = '이미 사용된 코드예요.'; return; }

      const studentRef = db.collection('students').doc(inv.studentId);
      const student = await studentRef.get();
      if(!student.exists){ errBox.textContent = '학생 정보를 찾을 수 없어요. 코치님께 알려주세요.'; return; }
      const sd = student.data();
      if(sd.uid && sd.uid !== uid){ errBox.textContent = '이미 다른 계정과 연결된 학생이에요.'; return; }

      await studentRef.update({ uid: uid });      // 학생 문서에 내 UID를 붙인다 = 연결 확정
      await inviteRef.update({ usedBy: uid });    // 코드에 사용 표시
      enterCheckin({ id: student.id, name: sd.name });
    }catch(err){
      errBox.textContent = '연결 실패: ' + (err.code || err.message);
    }finally{
      btn.disabled = false;
    }
  }

  // 로그인 상태가 바뀔 때마다 자동 실행
  // 로그아웃 -> 로그인 화면 / 로그인 + 연결된 학생 있음 -> 체크인 / 로그인 + 연결 없음 -> 코드 입력
  auth.onAuthStateChanged(async user => {
    if(!user){ myStudent = null; show('screen-login'); return; }
    document.getElementById('user-email').textContent = user.email;
    show('screen-loading');
    try{
      const mine = await findMyStudent(user.uid);
      if(mine) enterCheckin(mine); else show('screen-code');
    }catch(err){
      show('screen-code');
      document.getElementById('code-error').textContent = '확인 실패: ' + (err.code || err.message);
    }
  });
</script>
</body>
</html>
