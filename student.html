function showResultKeepScroll(){ const y=window.scrollY; showResult(); window.scrollTo(0,y); }

function drawTrend(){
  const canvas=$('trend'); if(!canvas) return;
  if(typeof Chart==='undefined'){ ensureChart().then(()=>{ if($('trend')===canvas) drawTrend(); }).catch(()=>{ if($('trend')===canvas) canvas.parentNode.innerHTML='<p class="note" style="padding-top:90px;text-align:center">그래프를 불러오지 못했어요 (인터넷 확인)</p>'; }); return; }   // 그래프 파일은 필요할 때 받는다. 못 받아도 나머지 화면은 그대로
  const m=METRICS.find(x=>x.key===trendKey), sleep=m.key==='sleepMin', end=todayStr();
  const days=[]; for(let i=trendRange-1;i>=0;i--) days.push(addDays(end,-i));
  const by=Object.fromEntries(myCheckins.map(c=>[c.date,c]));
  const conv=v=>sleep?v/60:v;
  const vals=days.map(d=>by[d]&&typeof by[d][m.key]==='number'?conv(by[d][m.key]):null);
  const st=baselineStats(historyFor(end),m.key);
  const sets=[{data:vals,borderColor:'#c6ff3d',backgroundColor:'#c6ff3d',borderWidth:2,tension:.25,spanGaps:true,pointRadius:vals.map((_,i)=>i===vals.length-1?5:3)}];
  if(st) sets.push({data:days.map(()=>conv(st.mean)),borderColor:'#828ba0',borderDash:[5,5],borderWidth:1,pointRadius:0});
  if(trendChart) trendChart.destroy();
  trendChart=new Chart(canvas,{type:'line',data:{labels:days.map(d=>d.slice(5).replace('-','/')),datasets:sets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{y:sleep?{grid:{color:'#2b3242'},ticks:{color:'#828ba0'}}:{min:0,max:10,grid:{color:'#2b3242'},ticks:{color:'#828ba0',stepSize:2}},
              x:{grid:{display:false},ticks:{color:'#828ba0',maxTicksLimit:7}}}}});
}

/* ============ 그래프 파일(Chart.js)은 필요할 때 한 번만 받는다 ============ */
let chartLoading=null;
function ensureChart(){
  if(typeof Chart!=='undefined') return Promise.resolve();
  if(chartLoading) return chartLoading;
  if(Date.now()-(ensureChart.failedAt||0)<30000) return Promise.reject(new Error('chart'));   // 인터넷이 끊겼을 때 계속 다시 받지 않게
  chartLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js';
    s.onload=()=>res(); s.onerror=()=>{ chartLoading=null; ensureChart.failedAt=Date.now(); s.remove(); rej(new Error('chart')); };
    document.head.appendChild(s);
  });
  return chartLoading;
}

/* ============ 실기 기록 ============
   선생님 기록: students/{학생}.records  (선생님이 정한 종목 events, 목표 targets 도 같은 문서)
   내가 입력한 기록: students/{학생}/perfRecords/{날짜_종목}  → 같은 날 같은 종목은 덮어쓴다
   같은 날짜에 둘 다 있으면 선생님 기록을 보여 준다. */
const perf={status:'idle',coach:{events:[],targets:{},records:{}},mine:[],denied:{doc:false,list:false},ev:null,ack:null,saving:false,justSaved:null,savedNote:''};
let perfChart=null;
async function loadPerfData(){
  if(!myStudent) return;
  perf.status='loading';
  const ref=db.collection('students').doc(myStudent.id);
  const [d,l]=await Promise.allSettled([ref.get(), ref.collection('perfRecords').get()]);
  const denied=r=>r.status==='rejected'&&r.reason&&r.reason.code==='permission-denied';
  if(d.status==='fulfilled'){
    const x=d.value.exists?d.value.data():{};
    // 학생 기록 저장소에 안전하게 들어갈 수 있는 이름의 종목만 보여 준다 (예: '/' 가 들어간 이름은 제외)
    perf.coach={events:Array.isArray(x.events)?x.events.filter(e=>PERF.safeEvent(e)):[],
      targets:(x.targets&&typeof x.targets==='object')?x.targets:{}, records:(x.records&&typeof x.records==='object')?x.records:{}};
    perf.denied.doc=false;
  }else{ perf.denied.doc=true; perf.coach={events:[],targets:{},records:{}}; }
  if(l.status==='fulfilled'){
    perf.mine=l.value.docs.map(x=>({...x.data(),rid:x.id})).filter(r=>PERF.safeEvent(r.event)&&PERF.validDate(r.date)&&PERF.numOf(r.value)!==null).map(r=>({...r,value:PERF.numOf(r.value)}));
    perf.denied.list=false;
  }else{ perf.mine=[]; perf.denied.list=true; }
  // 권한이 없는 것(규칙 준비 전)과 인터넷 문제는 다르게 안내한다. 인터넷 문제면 '다시 시도'로 다시 불러온다
  perf.status=(d.status==='rejected'&&!denied(d))||(l.status==='rejected'&&!denied(l))?'error':'ready';
  if(!$('screen-result').classList.contains('hidden')&&$('perf-sum')) $('perf-sum').innerHTML=perfSummaryHTML();
  if(!$('screen-perf').classList.contains('hidden')) renderPerf();
}
function perfEvents(){ const list=[...perf.coach.events]; perf.mine.forEach(r=>{ if(!list.includes(r.event)) list.push(r.event); }); return list; }
function perfRecs(ev){ return PERF.merge(perf.coach.records[ev]||[], perf.mine.filter(r=>r.event===ev)); }
function perfTarget(ev){ const t=perf.coach.targets[ev]; return t===undefined||t===null||t===''?null:t; }
function fbOpt(){ const t=myCheckins.find(c=>c.date===todayStr()); return {today:todayStr(),todayStatus:t?t.status:null}; }
function defaultEv(){ return perfEvents().find(ev=>perfRecs(ev).length)||perf.coach.events[0]||PERF.LIBRARY[0]; }
function perfId(date,ev){ return date+'_'+String(ev).replace(/\//g,'∕').slice(0,60); }

function perfSummaryHTML(){
  let body;
  if(perf.status==='error') body='<p class="note">실기 기록을 불러오지 못했어요. 인터넷을 확인하고 다시 시도해 주세요.</p><button class="btn btn-2" data-a="perf">다시 시도</button>';
  else if(perf.status!=='ready') body='<p class="note">실기 기록 불러오는 중...</p>';
  else if(perf.denied.list) body='<p class="note">실기 기록 기능을 준비하고 있어요. 곧 여기서 기록하고 피드백을 받을 수 있어요.</p>';
  else{
    const evs=perfEvents().filter(ev=>perfRecs(ev).length);
    body=evs.length
      ? evs.slice(0,4).map(ev=>{ const f=PERF.feedback(ev,perfRecs(ev),perfTarget(ev),fbOpt());
          return `<button class="pf-row" data-a="perf-ev" data-ev="${esc(ev)}"><span class="pf-ev">${esc(ev)}</span><span class="pf-val">${esc(PERF.withUnit(ev,f.latest.value))}</span><span class="pf-tag t-${f.tone}">${esc(f.headline)}</span></button>`; }).join('')
        +(evs.length>4?`<p class="note" style="margin-top:6px">외 ${evs.length-4}개 종목</p>`:'')
      : '<p class="note">측정한 실기 기록을 남기면 지난번·개인 최고·목표와 비교해서 알려 줘요.</p>';
    body+='<button class="btn btn-2" data-a="perf">실기 기록 입력하기</button>';
  }
  return `<h2 class="sec-t">실기 기록</h2>${body}`;
}

function openPerf(ev){
  if(ev) perf.ev=ev;
  perf.ack=null; perf.justSaved=null; perf.savedNote='';
  if(perfChart){ perfChart.destroy(); perfChart=null; }
  $('screen-perf').innerHTML='';   // 다시 열 때는 항상 오늘 날짜·빈 칸에서 시작 (어제 열어 둔 날짜가 남지 않게)
  renderPerf(); show('screen-perf');
  if(perf.status==='idle'||perf.status==='error') loadPerfData();
}
function hintHTML(ev,recs){
  const parts=[], t=perfTarget(ev), last=recs[recs.length-1];
  parts.push(t!==null?'목표 '+esc(PERF.withUnit(ev,Number(t))):'목표는 선생님이 정해요');
  if(last) parts.push('최근 '+esc(PERF.withUnit(ev,last.value))+' ('+PERF.md(last.date)+')');
  if(!PERF.isKnown(ev)) parts.push('선생님이 만든 종목');
  else if(PERF.isLower(ev)) parts.push('시간 종목: 숫자가 작을수록 좋아요');
  return parts.join(' · ');
}
function fbHTML(ev,f){
  if(!f.count) return '<p class="note">아직 기록이 없어요. 위에서 첫 기록을 남겨 보세요.</p>';
  return `<div class="fb-head t-${f.tone}">${esc(f.headline)}${perf.justSaved&&f.latest&&f.latest.rid===perf.justSaved?'<span class="fb-saved">방금 저장</span>':''}</div>`
    +f.lines.map(l=>`<div class="fb-line"><i class="t-${l.tone}"></i><span>${esc(l.text)}</span></div>`).join('');
}
function listHTML(ev,recs){
  if(!recs.length) return '<p class="note">기록이 쌓이면 여기에 날짜순으로 보여요.</p>';
  return recs.slice().reverse().map(r=>`<div class="rec"><span class="note">${PERF.md(r.date)}</span><span><b>${esc(PERF.withUnit(ev,r.value))}</b><span class="src">${r.by==='coach'?'선생님 기록':'내 기록'}</span></span>${r.by==='student'?`<button class="del" data-p="del" data-rid="${esc(r.rid)}" aria-label="${PERF.md(r.date)} ${esc(PERF.withUnit(ev,r.value))} 기록 지우기">지우기</button>`:'<span></span>'}</div>`).join('');
}
function renderPerf(){
  const box=$('screen-perf');
  const keep={date:$('pf-date')?$('pf-date').value:'', val:$('pf-val')?$('pf-val').value:''};
  const head=`<div class="head"><div><h1>실기 기록</h1><div class="date">기록하면 지난번·개인 최고·목표와 바로 비교해 줘요</div></div></div>`;
  if(perfChart){ perfChart.destroy(); perfChart=null; }
  if(perf.status==='error'){ box.innerHTML=head+'<div class="box">실기 기록을 불러오지 못했어요. 인터넷을 확인하고 <button class="link" data-p="retry">다시 시도</button>해 주세요.</div>'; return; }
  if(perf.status!=='ready'){ box.innerHTML=head+'<p class="note">불러오는 중...</p>'; return; }
  if(perf.denied.list){ box.innerHTML=head+'<div class="box">실기 기록 기능을 준비하고 있어요. 선생님이 기능을 켜면 여기서 기록할 수 있어요.</div>'; return; }
  if(!perf.ev) perf.ev=defaultEv();
  const ev=perf.ev, recs=perfRecs(ev), f=PERF.feedback(ev,recs,perfTarget(ev),fbOpt()), unit=PERF.unitOf(ev), today=todayStr();
  const coachEv=perf.coach.events;
  const others=[...new Set([...perf.mine.map(r=>r.event),...PERF.LIBRARY,ev])].filter(e=>!coachEv.includes(e));
  const opt=e=>`<option value="${esc(e)}" ${e===ev?'selected':''}>${esc(e)}</option>`;
  const sel=`<select id="pf-ev" class="txt">${coachEv.length?`<optgroup label="선생님이 정한 종목">${coachEv.map(opt).join('')}</optgroup>`:''}${others.length?`<optgroup label="${coachEv.length?'다른 종목':'종목'}">${others.map(opt).join('')}</optgroup>`:''}</select>`;
  box.innerHTML=head
    +(perf.denied.doc?'<div class="box note" style="margin-top:8px">선생님이 정한 종목·목표는 아직 볼 수 없어요. 종목을 직접 골라 기록할 수 있어요.</div>':'')
    +`<div class="q" style="border-top:0">
      <label class="fl" for="pf-ev" style="margin-top:0">종목</label>${sel}
      <div class="pf-grid">
        <div><label class="fl" for="pf-date">측정한 날</label><input id="pf-date" type="date" class="txt" max="${today}" min="${addDays(today,-365)}" value="${esc(keep.date||today)}"></div>
        <div><label class="fl" for="pf-val">기록${unit?' ('+esc(unit)+')':''}</label><input id="pf-val" class="txt" inputmode="${(PERF.rangeOf(ev)||[0])[0]<0?'text':'decimal'}" autocomplete="off" enterkeyhint="done" placeholder="${(PERF.rangeOf(ev)||[0])[0]<0?'예: -3 또는 12':PERF.isLower(ev)?'예: 9.85':'예: 251'}" value="${esc(keep.val)}"></div>
      </div>
      <div id="pf-hint" class="note pf-hint">${hintHTML(ev,recs)}</div>
      <button class="btn" data-p="save" ${perf.saving?'disabled':''}>${perf.saving?'저장하는 중...':'기록 저장'}</button>
      <div id="pf-err" class="err" role="alert"></div>
    </div>
    ${perf.savedNote?`<p class="note t-good" style="margin:12px 0 0">${esc(perf.savedNote)}</p>`:''}
    <div class="sec" id="pf-fb"><h2 class="sec-t">${esc(ev)} 피드백</h2>${fbHTML(ev,f)}</div>
    ${recs.length>=2?`<div class="sec"><h2 class="sec-t">기록 흐름${PERF.isLower(ev)?' · 위로 갈수록 빠른 기록':''}</h2><div class="chart-box"><canvas id="pf-chart" role="img" aria-label="${esc(ev)} 기록 그래프"></canvas></div><p class="note" style="margin-top:6px">초록 점은 내 기록, 회색 점은 선생님 기록${perfTarget(ev)!==null?', 주황 점선은 목표':''}이에요.</p></div>`:''}
    <div class="sec"><h2 class="sec-t">기록 목록 (${recs.length})</h2>${listHTML(ev,recs)}</div>`;
  drawPerfChart(ev,recs,f);
  updatePerfHint();
}
function drawPerfChart(ev,recs,f){
  const c=$('pf-chart'); if(!c) return;
  if(typeof Chart==='undefined'){ ensureChart().then(()=>{ if($('pf-chart')===c) drawPerfChart(ev,recs,f); }).catch(()=>{ if($('pf-chart')===c) c.parentNode.innerHTML='<p class="note" style="padding-top:80px;text-align:center">그래프를 불러오지 못했어요 (인터넷 확인)</p>'; }); return; }
  if(perfChart) perfChart.destroy();
  const colors=recs.map(r=>r.by==='coach'?'#aab2c5':'#c6ff3d');
  const best=f.best;
  const sets=[{data:recs.map(r=>r.value),borderColor:'#c6ff3d',pointBackgroundColor:colors,pointBorderColor:colors,pointRadius:recs.map(r=>best&&r.date===best.date&&r.value===best.value?6:3),borderWidth:2,tension:.25}];
  const t=perfTarget(ev); if(t!==null&&Number.isFinite(Number(t))) sets.push({data:recs.map(()=>Number(t)),borderColor:'#ff9f1c',borderDash:[5,5],borderWidth:1,pointRadius:0});
  perfChart=new Chart(c,{type:'line',data:{labels:recs.map(r=>PERF.md(r.date)),datasets:sets},
    options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}},
      scales:{y:{reverse:PERF.isLower(ev),grid:{color:'#2b3242'},ticks:{color:'#828ba0'}},x:{grid:{display:false},ticks:{color:'#828ba0',maxTicksLimit:7}}}}});
}
function resetPerfSave(){ perf.ack=null; const b=document.querySelector('[data-p="save"]'); if(b&&!perf.saving) b.textContent='기록 저장'; const e=$('pf-err'); if(e){ e.className='err'; e.textContent=''; } }
function updatePerfHint(){
  const h=$('pf-hint'); if(!h) return;
  const ev=$('pf-ev').value, date=$('pf-date').value, recs=perfRecs(ev), same=recs.find(r=>r.date===date);
  let extra='';
  if(same&&same.by==='coach') extra='<br><span class="t-warn">이 날에는 선생님이 적은 기록('+esc(PERF.withUnit(ev,same.value))+')이 있어요.</span>';
  else if(same) extra='<br><span class="t-warn">이 날 기록('+esc(PERF.withUnit(ev,same.value))+')이 있어요. 저장하면 바뀌어요.</span>';
  const raw=$('pf-val')?$('pf-val').value:'', pin=raw.trim()?PERF.parseInput(ev,raw):undefined;
  if(pin&&pin.note) extra+='<br><span class="t-good">'+esc(pin.note)+'로 저장돼요</span>';
  else if(pin===null&&!/^-?\d*[.,]?$/.test(raw.trim())) extra+='<br><span class="t-warn">숫자로 적어 주세요'+(PERF.unitOf(ev)?' (단위 '+esc(PERF.unitOf(ev))+')':'')+'</span>';
  h.innerHTML=hintHTML(ev,recs)+extra;
}
async function savePerf(){
  if(perf.saving){ const e=$('pf-err'); if(e){ e.className='err warn'; e.textContent='저장하는 중이에요. 잠시만 기다려 주세요.'; } return; }
  const ev=$('pf-ev').value, date=$('pf-date').value, err=$('pf-err'), btn=document.querySelector('[data-p="save"]');
  err.className='err'; err.textContent='';
  const pin=PERF.parseInput(ev,$('pf-val').value);
  if(pin===null){ err.textContent='기록을 숫자로 적어 주세요'+(PERF.unitOf(ev)?' (단위: '+PERF.unitOf(ev)+')':'')+'. 예: '+(PERF.isLower(ev)?'9.85':'251'); $('pf-val').focus(); return; }
  const v=pin.value;
  if(v<-100||v>10000){ err.textContent='기록 숫자가 너무 크거나 작아요 (-100 ~ 10000). 단위('+(PERF.unitOf(ev)||'단위')+')를 확인해 주세요.'; $('pf-val').focus(); return; }
  const today=todayStr();
  if(!PERF.validDate(date)||date>today){ err.textContent='측정한 날을 오늘이나 그 전으로 골라 주세요.'; return; }
  if(date<addDays(today,-365)){ err.textContent='1년 안의 기록만 저장할 수 있어요.'; return; }
  const same=perfRecs(ev).find(r=>r.date===date);
  if(same&&same.by==='coach'){ err.textContent=PERF.md(date)+'에는 선생님이 적은 기록('+PERF.withUnit(ev,same.value)+')이 있어요. 다른 날을 고르거나 선생님께 말씀해 주세요.'; return; }
  const warn=PERF.rangeWarn(ev,v), key=ev+'|'+date+'|'+v;
  // 한 번 더 눌러야 저장되는 경우: ① 보통 범위를 벗어난 값 ② 같은 날 이미 적은 내 기록을 바꾸는 경우 (하루에 한 기록만 남는다)
  const msgs=[];
  if(warn) msgs.push(warn);
  if(same&&same.by==='student'&&same.value!==v) msgs.push(PERF.md(date)+'에 이미 '+PERF.withUnit(ev,same.value)+'을(를) 적었어요. 하루에 한 기록(가장 좋은 기록)만 남아요.');
  if(msgs.length&&perf.ack!==key){ perf.ack=key; err.className='err warn'; err.textContent=msgs.join(' ')+' 맞으면 한 번 더 눌러 주세요.'; btn.textContent='맞아요, 저장하기'; return; }
  if(navigator.onLine===false){ err.textContent='인터넷이 끊겨 있어요. 와이파이나 데이터를 켠 뒤 다시 눌러 주세요.'; return; }
  perf.saving=true; btn.disabled=true; btn.textContent='저장하는 중...';
  const slow=setTimeout(()=>{ const e=$('pf-err'); if(e){ e.className='err warn'; e.textContent='인터넷이 느려서 저장이 늦어지고 있어요. 이 화면을 닫지 말고 잠시 기다려 주세요.'; } },8000);
  const rid=perfId(date,ev);
  try{
    await db.collection('students').doc(myStudent.id).collection('perfRecords').doc(rid)
      .set({event:ev,value:v,date,by:'student',uid:auth.currentUser.uid,studentId:myStudent.id,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    clearTimeout(slow);
    perf.mine=perf.mine.filter(r=>r.rid!==rid).concat([{event:ev,value:v,date,by:'student',rid}]);
    perf.saving=false; perf.ack=null; perf.ev=ev; perf.justSaved=rid;
    const recsNow=perfRecs(ev), lastNow=recsNow[recsNow.length-1];
    perf.savedNote=(pin.note?pin.note+'로 바꿔서 저장했어요. ':'')+(lastNow&&lastNow.rid===rid?'':PERF.md(date)+' '+PERF.withUnit(ev,v)+' 저장했어요. 아래 피드백은 가장 최근 기록 기준이에요.');
    if($('pf-val')) $('pf-val').value='';
    renderPerf();
    celebrateIfBest(ev,v,rid);
    const fb=$('pf-fb'); if(fb) fb.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  }catch(e){
    clearTimeout(slow); perf.saving=false;
    const b2=document.querySelector('[data-p="save"]'), e2=$('pf-err');   // 저장하는 동안 화면이 다시 그려졌을 수 있어서 새로 찾는다
    if(b2){ b2.disabled=false; b2.textContent='다시 저장하기'; }
    if(!e2) return;
    e2.className='err';
    e2.textContent=e.code==='permission-denied'?'기록 저장 권한이 아직 없어요. 선생님께 "실기 기록 저장이 안 돼요"라고 말씀해 주세요.':'저장 실패: '+(e.code||e.message)+' · 다시 눌러 주세요.';
  }
}
/* ---- 개인 최고·목표 달성 축하 (나와 선생님만 보는 기록. 순위는 없음) ---- */
function celebrateIfBest(ev,v,rid){
  if(!PERF.isKnown(ev)) return;
  const others=perfRecs(ev).filter(r=>r.rid!==rid);
  const pb=others.length>0&&others.every(r=>PERF.better(ev,v,r.value));
  const tg=perfTarget(ev), t=tg===null?NaN:Number(tg), reach=x=>Number.isFinite(t)&&(PERF.isLower(ev)?x<=t:x>=t);
  const goal=reach(v)&&!others.some(r=>reach(r.value));
  if(!pb&&!goal) return;
  const prev=pb?others.reduce((b,r)=>PERF.better(ev,r.value,b.value)?r:b,others[0]):null;
  const sub=(pb?'이전 최고 '+PERF.withUnit(ev,prev.value)+' ('+PERF.md(prev.date)+')보다 좋아졌어요.':'')+(goal?(pb?'<br>':'')+'목표 '+esc(PERF.withUnit(ev,t))+' 달성!':'');
  const colors=['#c6ff3d','#ff9f1c','#4fc3ff','#ff4b33','#ffd23f'];
  const bits=[...Array(24)].map((_,i)=>`<i style="left:${(i*37)%100}%;background:${colors[i%5]};animation-duration:${1.6+(i%5)*0.35}s;animation-delay:${(i%6)*0.08}s"></i>`).join('');
  const box=document.createElement('div');
  box.className='cele'; box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true'); box.setAttribute('aria-label',pb?'개인 최고 기록':'목표 달성');
  box.innerHTML=bits+`<div class="cele-card"><div class="cele-burst" aria-hidden="true">${pb?'🏅':'🎯'}</div><div class="cele-t">${pb?'개인 최고 기록!':'목표 달성!'}</div>
    <div class="cele-v">${esc(PERF.withUnit(ev,v))}</div><div class="cele-s">${esc(ev)}<br>${sub}</div><button class="btn" type="button">좋아요</button></div>`;
  const close=()=>{ box.remove(); const fb=$('pf-fb'); if(fb) fb.scrollIntoView({block:'start'}); };
  box.addEventListener('click',e=>{ if(e.target===box||e.target.closest('.btn')) close(); });
  box.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
  document.body.appendChild(box); box.querySelector('.btn').focus();
}
async function deletePerf(rid){
  const r=perf.mine.find(x=>x.rid===rid); if(!r) return;
  if(!confirm(PERF.md(r.date)+' '+r.event+' '+PERF.withUnit(r.event,Number(r.value))+' 기록을 지울까요?')) return;
  try{
    await db.collection('students').doc(myStudent.id).collection('perfRecords').doc(rid).delete();
    perf.mine=perf.mine.filter(x=>x.rid!==rid); perf.justSaved=null; renderPerf();
  }catch(e){ $('pf-err').textContent='지우지 못했어요: '+(e.code||e.message); }
}
$('screen-perf').addEventListener('click',e=>{
  const el=e.target.closest('[data-p]'); if(!el) return;
  if(el.dataset.p==='back'){ showResult(); }
  else if(el.dataset.p==='save') savePerf();
  else if(el.dataset.p==='del') deletePerf(el.dataset.rid);
  else if(el.dataset.p==='retry'){ perf.status='loading'; renderPerf(); loadPerfData(); }
});
$('screen-perf').addEventListener('change',e=>{
  if(e.target.id==='pf-ev'){ perf.ev=e.target.value; perf.ack=null; perf.justSaved=null; perf.savedNote=''; renderPerf(); const sel=$('pf-ev'); if(sel) sel.focus({preventScroll:true}); }
  else if(e.target.id==='pf-date'){ resetPerfSave(); updatePerfHint(); }
});
$('screen-perf').addEventListener('input',e=>{ if(e.target.id==='pf-val'||e.target.id==='pf-date'){ resetPerfSave(); updatePerfHint(); } });
$('screen-perf').addEventListener('keydown',e=>{ if(e.target.id==='pf-val'&&e.key==='Enter'){ e.preventDefault(); savePerf(); } });

/* ============ 개발용 테스트 데이터 (?dev=1 일 때만 화면에 나온다) ============ */
const DEV_EMAILS=['dragon040617@gmail.com'];   // 테스트 데이터 버튼을 볼 수 있는 계정
function isDev(){ return new URLSearchParams(location.search).get('dev')==='1'&&auth.currentUser&&DEV_EMAILS.includes(auth.currentUser.email); }
const SEED={
  sleepMin:[430,415,445,420,400,435,425,410,440,420],
  sleepQuality:[7,6,8,7,6,7,7,6,8,7],
  fatigue:[4,5,3,4,5,4,4,5,3,4],
  soreness:[3,4,2,3,4,3,3,4,2,3],
  stress:[3,3,2,4,3,3,2,3,3,3],
  readiness:[7,6,8,7,6,7,7,6,8,7]
};
function devPanel(){
  return `<div class="q"><h2>개발용 테스트 데이터</h2>
    <p class="note">어제부터 10일 전까지 가짜 기록을 넣어요. 이미 기록이 있는 날은 건드리지 않아요.</p>
    <div class="chips"><button class="chip on" data-a="seed">10일치 넣기</button><button class="chip pain" data-a="clearseed">테스트 데이터 지우기</button></div>
    <div id="dev-msg" class="note" style="margin-top:10px;"></div></div>`;
}
async function seedData(){
  const msg=$('dev-msg'); msg.textContent='넣는 중...';
  try{
    const col=db.collection('students').doc(myStudent.id).collection('checkins');
    const batch=db.batch(), today=todayStr(); let n=0;
    for(let i=0;i<10;i++){
      const date=addDays(today,-(10-i));
      if(myCheckins.some(c=>c.date===date)) continue;
      batch.set(col.doc(date),{date,sleepMin:SEED.sleepMin[i],sleepQuality:SEED.sleepQuality[i],fatigue:SEED.fatigue[i],
        soreness:SEED.soreness[i],sorenessAreas:['허벅지 앞'],sorenessImpact:1,stress:SEED.stress[i],stressCauses:[],
        readiness:SEED.readiness[i],studentId:myStudent.id,status:'BASE',reasons:[],painFollowUp:null,pain:false,painAreas:[],painLevel:null,painNote:'',seed:true,
        checkedAt:firebase.firestore.FieldValue.serverTimestamp()});
      n++;
    }
    if(!n){ msg.textContent='넣을 날짜가 없어요. 이미 기록이 있어요.'; return; }
    await batch.commit(); await enterApp(myStudent);
  }catch(e){ msg.textContent='실패: '+(e.code||e.message); }
}
async function clearSeed(){
  const msg=$('dev-msg'); msg.textContent='지우는 중...';
  try{
    const col=db.collection('students').doc(myStudent.id).collection('checkins');
    const batch=db.batch(); let n=0;
    myCheckins.filter(c=>c.seed===true).forEach(c=>{ batch.delete(col.doc(c.date)); n++; });
    if(!n){ msg.textContent='지울 테스트 데이터가 없어요.'; return; }
    await batch.commit(); await enterApp(myStudent);
  }catch(e){ msg.textContent='실패: '+(e.code||e.message); }
}
