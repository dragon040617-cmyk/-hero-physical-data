<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151c">
<title>HERO 체크인</title>
<!-- 속도: 서버와 미리 연결해 두고, 글꼴은 화면을 막지 않게 나중에 입힌다 (글꼴이 늦으면 기본 글꼴로 먼저 보임) -->
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="HERO">
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<style>
  :root{
    --bg:#12151c; --surface:#1a1f29; --surface2:#222836; --line:#2b3242;
    --text:#fff; --muted:#aab2c5; --dim:#8b94a9;
    --lime:#c6ff3d; --lime-soft:rgba(198,255,61,.14);
    --coral:#ff4b33; --coral-soft:rgba(255,75,51,.14);
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; overflow-x:clip; }
  body{ overflow-wrap:break-word; overflow-x:clip; word-break:keep-all; }   /* 한국어는 띄어쓰기 단위로 줄바꿈 */
  body{ margin:0; background:var(--bg); color:var(--text); line-height:1.5; font-variant-numeric:tabular-nums;
        font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif; }
  button,select,textarea{ font-family:inherit; }
  .screen{ max-width:480px; margin:0 auto; padding:calc(28px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom)); }
  /* 아이패드·컴퓨터: 가운데 기둥을 조금 넓힌다 (양옆 여백은 같게) */
  @media (min-width:768px){ .screen{ max-width:600px; padding-left:28px; padding-right:28px; } }
  .hidden{ display:none; }
  h1{ font-size:24px; margin:0 0 6px; font-weight:700; }
  h2{ font-size:17px; margin:0 0 4px; font-weight:700; }
  p{ color:var(--muted); margin:0 0 20px; }
  b{ font-weight:700; color:var(--text); }
  .btn{ width:100%; height:52px; border:0; border-radius:12px; background:var(--lime); color:#0d1a03; font-size:16px; font-weight:700; cursor:pointer; }
  .btn:disabled{ opacity:.5; }
  .link{ background:none; border:0; color:var(--muted); font-size:14px; text-decoration:underline; padding:10px 0; min-height:44px; cursor:pointer; }
  .link-row{ display:flex; flex-wrap:wrap; gap:4px 28px; margin-top:12px; }   /* 링크 두 개가 붙어 있으면 잘못 누르기 쉬워서 간격을 둔다 */
  .offline{ border:1px solid #ffd23f; background:rgba(255,210,63,.10); color:#ffe27a; border-radius:12px; padding:10px 14px; font-size:14px; margin-bottom:12px; }
  .err{ color:#ff6b5a; font-size:14px; min-height:20px; margin-top:12px; }
  .note{ font-size:13px; color:var(--dim); }
  input.code{ width:100%; height:52px; margin-bottom:12px; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:18px; letter-spacing:4px; text-align:center; }

  /* 가입 화면 */
  .steps{ display:flex; gap:6px; margin-bottom:18px; font-size:12px; }
  .steps span{ flex:1; text-align:center; padding:6px 0; border-radius:8px; background:var(--surface); color:var(--dim); }
  .steps span.on{ background:var(--lime); color:#0d1a03; font-weight:700; }
  .steps span.done{ color:var(--lime); }
  .fl{ display:block; font-size:15px; font-weight:600; margin:18px 0 8px; }
  .fl em{ font-style:normal; font-size:12px; color:var(--lime); margin-left:4px; font-weight:500; }
  .fl .opt{ font-size:12px; color:var(--dim); margin-left:4px; font-weight:400; }
  input.txt, select.txt{ width:100%; height:50px; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:16px; font-family:inherit; }
  .chips + .fl{ margin-top:18px; }
  .consent{ display:flex; gap:10px; align-items:flex-start; margin-top:22px; font-size:14px; color:var(--muted); line-height:1.5; }
  .consent input{ width:22px; height:22px; margin:0; flex-shrink:0; accent-color:var(--lime); }
  .box{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .kv{ display:grid; grid-template-columns:76px minmax(0,1fr); gap:8px; padding:6px 0; font-size:15px; }
  .kv b{ color:var(--dim); font-weight:500; }
  .reject{ border:1px solid var(--coral); background:var(--coral-soft); border-radius:12px; padding:12px 14px; margin-bottom:8px; font-size:14px; }

  /* 헤더 */
  /* 제목은 한 줄을 다 쓰고, 버튼은 그 아래 한 줄에 (좁은 화면에서 제목이 두 줄로 끊기지 않게) */
  .head{ margin-bottom:8px; }
  .head .date{ font-size:14px; color:var(--dim); }
  .head-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .head-actions.grid4{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }   /* 휴대폰: 2×2 로 반듯하게 (한 개만 아랫줄로 떨어지지 않게) */
  @media (min-width:480px){ .head-actions.grid4{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
  .head-actions.grid4 .link{ padding:0 6px; }
  .head-actions .link{ font-size:14px; text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:0 16px; min-height:44px; color:var(--muted); background:var(--surface); }

  /* 체크인 폼 */
  .q{ padding:22px 0; border-top:1px solid var(--line); }
  .q-title{ font-size:16px; font-weight:600; margin-bottom:2px; }
  .q-hint{ font-size:13px; color:var(--dim); margin-bottom:12px; }
  .scale{ display:grid; grid-template-columns:repeat(11,1fr); gap:3px; }
  .scale button{ height:44px; padding:0; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:15px; font-weight:600; cursor:pointer; }
  .scale button.on{ background:var(--lime); border-color:var(--lime); color:#0d1a03; }
  .scale.pain button.on{ background:var(--coral); border-color:var(--coral); color:#1a0805; }
  .anchors{ display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-top:6px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .chip{ height:44px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:14px; font-weight:500; cursor:pointer; }
  .chip.on{ border-color:var(--lime); color:var(--lime); background:var(--lime-soft); }
  .chip.pain.on{ border-color:var(--coral); color:var(--coral); background:var(--coral-soft); }
  .sub-q{ margin-top:16px; font-size:14px; color:var(--muted); }
  .sleep-row{ display:flex; gap:10px; }
  .sleep-row select{ flex:1; height:52px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:16px; padding:0 12px; }
  textarea.memo{ width:100%; margin-top:12px; min-height:72px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:16px; padding:12px; resize:vertical; }
  .submit-bar{ position:sticky; bottom:0; background:var(--bg); border-top:1px solid var(--line); padding:12px 0 calc(12px + env(safe-area-inset-bottom)); margin-top:8px; }
  .progress{ height:3px; background:var(--line); border-radius:2px; margin-bottom:10px; overflow:hidden; }
  .progress i{ display:block; height:100%; background:var(--lime); }

  /* 결과 화면 */
  .pain-card{ border:1px solid var(--coral); background:var(--coral-soft); border-radius:12px; padding:14px 16px; margin:12px 0 4px; }
  .pain-card p{ margin:6px 0 0; font-size:14px; }
  .row{ padding:14px 0; border-top:1px solid var(--line); }
  .sec-t + .row{ border-top:0; padding-top:4px; }   /* 제목 바로 다음에 오는 첫 줄만 선 없애기 */
  .row-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .row-label{ font-weight:600; }
  .row-val{ font-size:18px; font-weight:700; }
  .dv{ position:relative; height:8px; border-radius:4px; background:var(--surface2); margin:10px 0 6px; overflow:hidden; }
  .dv-mid{ position:absolute; left:50%; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--dim); z-index:2; }
  .dv-fill{ position:absolute; top:0; bottom:0; }
  .dv-fill.better{ background:var(--lime); } .dv-fill.worse{ background:var(--coral); } .dv-fill.same{ background:var(--dim); }
  .pb{ height:8px; border-radius:4px; background:var(--surface2); margin:10px 0 6px; overflow:hidden; }
  .pb i{ display:block; height:100%; background:var(--muted); }
  .row-sub{ display:flex; justify-content:space-between; gap:12px; font-size:13px; color:var(--muted); }
  .row-sub .tag-better{ color:var(--lime); } .row-sub .tag-worse{ color:var(--coral); }
  .row-ctx{ font-size:13px; color:var(--dim); margin-top:2px; }
  .advice{ border-top:1px solid var(--line); padding:20px 0; }
  .advice .tag{ display:inline-block; font-size:12px; color:var(--dim); border:1px solid var(--line); border-radius:999px; padding:1px 10px; margin-bottom:10px; }
  .advice p{ color:var(--text); margin:0 0 8px; font-size:16px; }
  .range{ display:flex; gap:8px; justify-content:flex-end; margin-bottom:8px; }
  .chart-box{ position:relative; height:220px; margin-top:12px; }

  /* 결과 화면 v2 */
  .status{ border:1px solid; border-radius:14px; padding:16px; margin:12px 0 0; }
  .badge{ font-size:13px; font-weight:700; }
  .headline{ font-size:19px; font-weight:700; line-height:1.45; margin-top:4px; }
  .reasons{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .reasons span{ font-size:13px; padding:3px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .pain-note{ font-size:14px; color:#ff8a7a; margin:10px 0 0; }
  .sec{ border-top:1px solid var(--line); padding:20px 0; margin-top:20px; }
  .sec + .sec{ margin-top:0; }
  .sec-t{ font-size:14.5px; font-weight:600; color:var(--muted); margin-bottom:8px; }
  .sec p{ color:var(--text); margin:0; font-size:16px; }
  .talk{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; font-size:16px; line-height:1.6; }
  .care{ display:grid; grid-template-columns:44px minmax(0,1fr); gap:10px; padding:10px 0; font-size:15px; line-height:1.55; }
  .care + .care{ border-top:1px solid var(--line); }
  .care b{ color:var(--dim); font-weight:600; font-size:14px; padding-top:1px; }
  .care-n{ font-weight:700; margin-bottom:4px; }
  .care-d{ border:1px solid var(--line); border-radius:10px; padding:0 12px; margin-bottom:8px; }
  .care-d summary{ font-weight:700; padding:12px 0; cursor:pointer; list-style-position:inside; }
  .care-d[open] summary{ border-bottom:1px solid var(--line); margin-bottom:6px; }
  .care-d .care-l:last-child{ padding-bottom:10px; }
  h2.sec-t{ font-weight:600; margin:0 0 8px; }
  :focus-visible{ outline:2px solid var(--lime); outline-offset:2px; }
  .care-l{ font-size:15px; padding:3px 0; }
  .care-k{ display:inline-block; font-size:12px; color:var(--lime); border:1px solid var(--line); border-radius:999px; padding:0 8px; margin-right:6px; }
  .care-m{ font-size:14px; color:var(--muted); margin-top:1px; }

  /* 불러오는 화면 */
  .boot{ display:flex; flex-direction:column; align-items:center; gap:14px; padding-top:28vh; text-align:center; }
  .boot-mark{ font-weight:800; letter-spacing:.24em; color:var(--lime); font-size:15px; }
  .boot p{ margin:0; }
  .spinner{ width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--lime); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .spinner{ animation:none; } }

  /* 실기 기록 */
  .btn-2{ background:var(--surface); color:var(--text); border:1px solid var(--line); margin-top:12px; }
  .pf-row{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--line); padding:12px 0; color:var(--text); font:inherit; cursor:pointer; min-height:44px; }
  .sec-t + .pf-row{ border-top:0; padding-top:4px; }
  .pf-ev{ font-weight:600; }
  .pf-val{ font-weight:700; font-variant-numeric:tabular-nums; text-align:right; }
  .pf-tag{ grid-column:1 / -1; font-size:13px; }
  .t-good{ color:var(--lime); } .t-warn{ color:#ffb35c; } .t-info{ color:var(--muted); } .t-bad{ color:#ff8a7a; }
  .pf-grid{ display:grid; grid-template-columns:minmax(0,1fr); gap:0 10px; }   /* 휴대폰: 날짜·기록을 한 줄씩 (아이폰 날짜가 반쪽 칸에 안 들어가던 문제) */
  @media (min-width:480px){ .pf-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .pf-grid .fl{ margin-top:14px; }
  .pf-hint{ margin:10px 0 14px; line-height:1.6; }
  input[type=date].txt{ -webkit-appearance:none; appearance:none; display:block; width:100%; min-width:0; max-width:100%; height:50px; line-height:48px; text-align:left; padding:0 14px; }
  input[type=date].txt::-webkit-date-and-time-value{ text-align:left; margin:0; line-height:48px; }   /* 아이폰: 날짜 글자를 칸 가운데 높이에, 왼쪽 정렬로 */
  input[type=date].txt::-webkit-datetime-edit{ padding:0; line-height:48px; }
  input[type=date].txt::-webkit-calendar-picker-indicator{ filter:invert(.8); }
  .fb-head{ font-size:18px; font-weight:700; margin-bottom:8px; }
  .fb-line{ display:grid; grid-template-columns:10px minmax(0,1fr); gap:10px; padding:5px 0; font-size:15px; line-height:1.55; }
  .fb-line i{ width:8px; height:8px; border-radius:50%; margin-top:8px; background:var(--muted); }
  .fb-line i.t-good{ background:var(--lime); } .fb-line i.t-warn{ background:#ffb35c; } .fb-line i.t-bad{ background:#ff8a7a; }
  .fb-saved{ display:inline-block; font-size:12px; color:#0d1a03; background:var(--lime); border-radius:999px; padding:1px 8px; margin-left:6px; vertical-align:2px; }
  .rec{ display:grid; grid-template-columns:56px minmax(0,1fr) auto; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:15px; }
  .sec-t + .rec{ border-top:0; }
  .rec .src{ font-size:12px; color:var(--dim); margin-left:6px; }
  .rec .del{ background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px; min-height:44px; padding:0 12px; font:inherit; font-size:13px; cursor:pointer; }
  .err.warn{ color:#ffd23f; }

  /* ===== 아래 메뉴 (오늘 · 몸관리 · 실기 기록 · 내 정보) ===== */
  .bnav{ position:fixed; left:0; right:0; bottom:0; z-index:50; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px;
    background:rgba(26,31,41,.97); border-top:1px solid var(--line); padding:6px 8px calc(6px + env(safe-area-inset-bottom)); }
  .bnav.hidden{ display:none; }
  .bnav button{ background:none; border:0; border-radius:12px; color:var(--dim); font:inherit; font-size:12.5px; font-weight:600; min-height:54px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; }
  .bnav button .ic{ font-size:20px; line-height:1; filter:grayscale(1); opacity:.75; }
  .bnav button[aria-current="page"]{ color:var(--lime); background:var(--lime-soft); }
  .bnav button[aria-current="page"] .ic{ filter:none; opacity:1; }
  @media (min-width:768px){ .bnav{ max-width:600px; margin:0 auto; border:1px solid var(--line); border-bottom:0; border-radius:18px 18px 0 0; } }
  body.with-nav .screen{ padding-bottom:calc(100px + env(safe-area-inset-bottom)); }

  /* 오늘 할 것 */
  .todo-box{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:6px 14px 10px; margin-top:16px; }
  .todo-h{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:10px 0 4px; }
  .todo-h b{ font-size:16px; } .todo-h span{ font-size:13px; color:var(--muted); }
  .todo{ display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:8px; border-top:1px solid var(--line); }
  .todo:first-of-type{ border-top:0; }
  .todo-c{ display:grid; grid-template-columns:28px minmax(0,1fr); gap:10px; align-items:start; background:none; border:0; color:var(--text); font:inherit; text-align:left; padding:12px 0; min-height:48px; cursor:pointer; }
  .todo-c i{ width:24px; height:24px; border-radius:50%; border:2px solid var(--dim); display:flex; align-items:center; justify-content:center; font-style:normal; font-size:14px; color:#0d1a03; margin-top:1px; }
  .todo-c .k{ display:block; font-size:12.5px; color:var(--lime); margin-bottom:1px; }
  .todo-c .v{ font-size:15px; line-height:1.5; }
  .todo.done .todo-c i{ background:var(--lime); border-color:var(--lime); }
  .todo.done .todo-c .v{ color:var(--dim); text-decoration:line-through; }
  .todo-more{ background:none; border:0; color:var(--muted); font:inherit; font-size:13px; min-height:44px; padding:0 4px; cursor:pointer; white-space:nowrap; }
  .status-foot{ display:flex; justify-content:flex-end; margin-top:6px; }
  .status-foot .link{ font-size:14px; padding:0 4px; }

  /* 이번 주 체크인 */
  .week{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; margin:6px 0 10px; }
  .week div{ text-align:center; font-size:12px; color:var(--dim); }
  .week i{ display:flex; align-items:center; justify-content:center; height:34px; border-radius:10px; border:1px solid var(--line); font-style:normal; font-size:14px; margin-top:4px; color:var(--dim); }
  .week .on i{ background:var(--lime); border-color:var(--lime); color:#0d1a03; font-weight:800; }
  .week .today i{ border-color:var(--muted); border-width:2px; }
  .week-s{ font-size:14.5px; color:var(--muted); line-height:1.6; }
  .week-s b{ color:var(--text); }

  /* 자세히 보기 (평소와 비교·그래프) */
  details.more{ border-top:1px solid var(--line); margin-top:20px; }
  details.more > summary{ list-style:none; display:flex; justify-content:space-between; align-items:center; gap:10px; min-height:56px; cursor:pointer; font-weight:600; font-size:15.5px; }
  details.more > summary::-webkit-details-marker{ display:none; }
  details.more > summary::after{ content:'펼치기 ▾'; font-size:13px; font-weight:500; color:var(--muted); }
  details.more[open] > summary::after{ content:'접기 ▴'; }

  /* 몸관리 화면 */
  .seg{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:4px; margin:14px 0 4px; position:sticky; top:calc(6px + env(safe-area-inset-top)); z-index:5; }
  .seg button{ min-height:46px; border:0; border-radius:10px; background:none; color:var(--muted); font:inherit; font-size:15px; font-weight:700; cursor:pointer; }
  .seg button[aria-selected="true"]{ background:var(--lime); color:#0d1a03; }
  .seg button small{ font-size:12px; font-weight:600; opacity:.8; }
  .cstate{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px; font-size:14px; color:var(--muted); }
  .cstate b{ font-size:13px; border:1px solid; border-radius:999px; padding:1px 10px; }
  .ccard{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:12px; }
  .ccard h3{ font-size:16.5px; margin:0 0 8px; }
  .ctime{ display:grid; grid-template-columns:minmax(0,1fr); gap:0; }
  .ctime .care-l{ border-top:1px solid var(--line); padding:10px 0; }
  .ctime .care-l:first-child{ border-top:0; padding-top:2px; }
  .ccard .care-l{ font-size:15.5px; line-height:1.55; }

<!-- 속도: 무거운 파일은 화면 글자를 먼저 보여 준 다음에 받는다 (예전엔 <head>에 있어서 다 받을 때까지 빈 화면) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-firestore-compat.min.js"></script>
<script>
/* ============ 설정값 ============ */
const BASELINE_MIN_DAYS = 6;      // 평소 비교를 시작하는 최소 체크인 횟수 (주 2~3회 × 4주 기준, D2-B)
const BASELINE_WINDOW_DAYS = 28;  // 평소 = 오늘 이전 최근 28일 (그 안에 6번 이상 체크인하면 비교 시작)
const BODY_PARTS = ["정강이","종아리","무릎","허벅지 앞","허벅지 뒤","엉덩이","허리","발목","발바닥","어깨","등","목","손목","기타"];
const STRESS_CAUSES = ["학교","시험","입시","훈련","인간관계","수면 부족","기타"];
const IMPACTS = ["없음","약간","훈련에 영향","훈련 어려움"];
const METRICS = [
  {key:'sleepMin',     label:'수면',     good:'up',   floor:45},   // floor: 이 정도 차이는 있어야 '달라졌다'고 본다
  {key:'sleepQuality', label:'수면의 질', good:'up',   floor:1.5},
  {key:'fatigue',      label:'피로',     good:'down', floor:1.5},
  {key:'soreness',     label:'근육통',   good:'down', floor:1.5},
  {key:'stress',       label:'스트레스', good:'down', floor:1.5},
  {key:'readiness',    label:'준비도',   good:'up',   floor:1.5},
];

/* PURE:START  (화면과 무관한 계산 - 따로 테스트 가능) */
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return ymd(new Date()); }
function addDays(s,n){ const [y,m,d]=s.split('-').map(Number); return ymd(new Date(y,m-1,d+n)); }
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fmtSleep(min){ const h=Math.floor(min/60), m=Math.round(min%60); return m? h+'시간 '+m+'분' : h+'시간'; }
function fmtValue(key,v){ return key==='sleepMin' ? fmtSleep(v) : v+'/10'; }
function fmtDelta(key,d){
  if(key==='sleepMin'){
    const a=Math.abs(Math.round(d)); if(a<1) return '차이 없음';
    return (a>=60 ? fmtSleep(a) : a+'분')+(d>0?' 증가':' 감소');
  }
  const a=Math.abs(d); if(a<0.05) return '차이 없음';
  return a.toFixed(1)+(d>0?' 증가':' 감소');
}

// 평균과 표준편차 (표준편차 = 평소에도 이 정도는 흔들린다는 뜻)
function baselineStats(history,key){
  const v=history.map(h=>h[key]).filter(x=>typeof x==='number');
  if(v.length<BASELINE_MIN_DAYS) return null;
  const mean=v.reduce((a,b)=>a+b,0)/v.length;
  const sd=Math.sqrt(v.reduce((a,b)=>a+(b-mean)**2,0)/(v.length-1));
  return {mean,sd,n:v.length};
}

// 항목마다: 오늘 값, 평소 평균, 차이, '얼마나 달라졌나' 점수, 좋아졌나/나빠졌나
function analyze(today,history){
  const ready=history.length>=BASELINE_MIN_DAYS;
  const rows=METRICS.map(m=>{
    const value=today[m.key];
    const st=ready?baselineStats(history,m.key):null;
    if(!st) return {m,value,st:null,tone:'none',score:0,delta:0};
    const delta=value-st.mean;
    const score=delta/Math.max(st.sd,m.floor);          // 평소 흔들림(또는 최소 기준)의 몇 배만큼 벗어났나
    const sign=Math.sign(delta)*(m.good==='up'?1:-1);
    const tone=Math.abs(score)<1?'same':(sign>0?'better':'worse');
    return {m,value,st,delta,score,tone};
  });
  if(ready) rows.sort((a,b)=>Math.abs(b.score)-Math.abs(a.score));
  return {ready,rows,n:history.length};
}

// 받침에 따라 조사 고르기 (예: 무릎이 / 허리가)
function josa(w,a,b){ const c=w.charCodeAt(w.length-1); if(c<0xAC00||c>0xD7A3) return w+b; return w+(((c-0xAC00)%28)?a:b); }
function absSleep(d){ const a=Math.abs(Math.round(d)); return a>=60?fmtSleep(a):a+'분'; }
function chipFor(r){ return r.m.label+' '+(r.m.key==='sleepMin'?(r.delta>0?'+':'-')+absSleep(r.delta):(r.delta>0?'+':'')+r.delta.toFixed(1)); }
const PHRASE={
  sleepMin:r=>'평소보다 잠을 '+absSleep(r.delta)+' 덜 잤어요',
  sleepQuality:()=>'평소보다 잠을 푹 못 잤어요',
  fatigue:()=>'평소보다 많이 피곤한 상태예요',
  soreness:()=>'평소보다 근육통이 심해요',
  stress:()=>'평소보다 스트레스가 많은 날이에요',
  readiness:()=>'평소보다 몸이 덜 준비된 느낌이에요'
};
const STATUS_UI={
  GREEN:{label:'좋음',color:'#c6ff3d',bg:'rgba(198,255,61,.10)'},
  YELLOW:{label:'주의',color:'#ffd23f',bg:'rgba(255,210,63,.10)'},
  AMBER:{label:'경고',color:'#ff9f1c',bg:'rgba(255,159,28,.12)'},
  RED:{label:'위험',color:'#ff4b33',bg:'rgba(255,75,51,.14)'},
  BASE:{label:'기준 만드는 중',color:'#aab2c5',bg:'rgba(170,178,197,.08)'}
};

// 빨강(평소보다 2.0 이상 악화)은 몸 지표에만 적용. 스트레스·수면의 질은 주황까지만.
const BODY_KEYS=['sleepMin','fatigue','soreness','readiness'];
// 오늘 상태 판정: 위에서부터 먼저 걸리는 조건이 등급이 된다 (안전 우선)
function judge(t,an){
  const worse=an.ready?an.rows.filter(r=>r.tone==='worse'):[];
  const better=an.ready?an.rows.filter(r=>r.tone==='better'):[];
  const get=k=>an.rows.find(r=>r.m.key===k);
  const isW=k=>worse.includes(get(k));
  const bad=r=>Math.abs(r.score);
  const areas=(t.painAreas||[]).join('·'), sAreas=(t.sorenessAreas||[]).join('·');
  const painHigh=t.pain&&t.painLevel>=4, painLow=t.pain&&!painHigh;
  const sleepLow=t.sleepMin<300, follow=t.painFollowUp;
  const special=[]; let status, headline;

  if(painHigh){ status='RED'; headline=(areas?areas+' ':'')+'통증이 있어요. 훈련 전에 선생님께 먼저 말해 주세요.'; special.push((areas?areas+' ':'')+'통증 '+t.painLevel+'/10'); }
  else if(t.sorenessImpact===3){ status='RED'; headline='근육통 때문에 움직이기 힘든 상태예요. 훈련 전에 선생님께 말해 주세요.'; special.push((sAreas||'근육통')+' · 훈련 어려움'); }
  else if(t.readiness<=2){ status='RED'; headline='오늘 몸이 많이 무거워요. 훈련 전에 선생님께 말해 주세요.'; special.push('준비도 '+t.readiness+'/10'); }
  else if(worse.some(r=>bad(r)>=2&&BODY_KEYS.includes(r.m.key))){ const r=worse.find(r=>bad(r)>=2&&BODY_KEYS.includes(r.m.key)); status='RED'; headline=PHRASE[r.m.key](r)+'. 훈련 전에 선생님께 말해 주세요.'; }
  else if(painLow){ status='AMBER'; headline=(areas?areas+'에 ':'')+'약한 통증이 있어요. 선생님께 미리 말해 두세요.'; special.push((areas?areas+' ':'')+'통증 '+t.painLevel+'/10'); }
  else if(follow===2){ status='AMBER'; headline='어제 아팠던 곳이 오늘 아침 더 아팠어요. 선생님께 말해 주세요.'; special.push('아침 통증 증가'); }
  else if(sleepLow){ status='AMBER'; headline='어젯밤 '+fmtSleep(t.sleepMin)+'밖에 못 잤어요.'; special.push('수면 '+fmtSleep(t.sleepMin)); }
  else if(isW('sleepMin')&&(isW('fatigue')||isW('readiness'))){ status='AMBER'; headline='잠이 부족하고 몸도 무거운 날이에요.'; }
  else if(worse.filter(r=>bad(r)>=1.5).length>=2){ status='AMBER'; headline=PHRASE[worse[0].m.key](worse[0])+'.'; }
  else if(t.sorenessImpact===2){ status='AMBER'; headline=(sAreas?josa(sAreas,'이','가'):'근육통이')+' 훈련에 영향을 주는 상태예요.'; special.push((sAreas||'근육통')+' · 훈련에 영향'); }
  else if(!an.ready){ status='BASE'; headline='평소 기준을 만드는 중이에요 ('+an.n+'/'+BASELINE_MIN_DAYS+'회)'; }
  else if(worse.length||(['무릎','정강이','허리'].some(a=>(t.sorenessAreas||[]).includes(a))&&t.sorenessImpact===1)){
    status='YELLOW'; headline=worse.length?PHRASE[worse[0].m.key](worse[0])+'.':josa(sAreas,'이','가')+' 조금 불편한 상태예요.'; if(!worse.length) special.push(sAreas+' 뻐근함'); }
  else { status='GREEN'; headline=better.length?'평소보다 컨디션이 좋아요.':'평소랑 비슷한 컨디션이에요.'; }
  if(follow===1) special.push('아침 통증 그대로');

  let reasons=special.concat(worse.map(chipFor)).slice(0,3);
  if(!reasons.length&&an.ready) reasons=better.length?better.slice(0,2).map(chipFor):['평소와 비슷'];

  // 오늘 훈련 참고 (부하 처방은 코치 화면에만)
  let train;
  if(status==='RED') train='오늘 훈련은 선생님이 상태를 보고 정해 줄 거예요. 혼자 무리하지 마세요.';
  else if(status==='AMBER') train=(t.pain||follow===2)?'아픈 곳에 무리가 가는 동작은 선생님과 먼저 이야기하고 하세요.'
    :t.sorenessImpact===2?'불편한 동작이 있으면 참지 말고 바로 선생님께 말하세요.'
    :'몸이 평소보다 무거운 날이에요. 웜업을 충분히 하고, 훈련 중에 이상하면 바로 말하세요.';
  else if(status==='YELLOW') train=isW('stress')?'훈련 전에 숨을 길게 내쉬면서 몸을 풀고 시작하세요.':(isW('soreness')||t.sorenessImpact===1)?'뻐근한 곳은 웜업으로 충분히 풀고 시작하세요.':'훈련 초반에 몸 상태를 먼저 확인하고 시작하세요.';
  else if(status==='GREEN') train=better.length?'측정이나 강한 훈련을 하기 좋은 상태예요.':'평소대로 훈련하면 돼요.';
  else train='아직 오늘 값만 보고 있어요. 평소와 다르게 느껴지면 선생님께 말하세요.';

  // 몸관리용 '신호': 평소보다 나빠졌거나, 평소 기준이 아직 없을 땐(최근 28일 체크인 6회 전) 점수 자체가 높거나 낮으면
  const ABS={sleepMin:v=>v<360,sleepQuality:v=>v<=3,fatigue:v=>v>=7,soreness:v=>v>=7,stress:v=>v>=7,readiness:v=>v<=3};
  const flag=k=>isW(k)||(!an.ready&&ABS[k](t[k]));
  const ctx={t,isW,flag,areas,sAreas,painHigh,sleepLow,follow,status,
    tired:sleepLow||flag('sleepMin')||flag('fatigue')||flag('readiness')||t.readiness<=2};
  return {status,headline,reasons,train,coachTalk:coachMessage(ctx),care:buildCare(ctx)};
}

/* ---- 선생님께 드릴 말 (정중한 형식, 데이터에 따라 바뀜) ---- */
function coachMessage(c){
  const t=c.t, facts=[];
  let main=null, ask=null, usedSleep=false;
  if(t.pain){
    main=c.areas?'선생님, 오늘 '+josa(c.areas,'이','가')+' 아픕니다':'선생님, 오늘 아픈 곳이 있습니다';
    facts.push('10점 중 '+t.painLevel+'점');
    if(t.painNote) facts.push(t.painNote.length>40?t.painNote.slice(0,40)+'…':t.painNote);
    ask=c.painHigh?'훈련 전에 한번 봐 주실 수 있을까요?':'해당 부위에 무리가 가는 운동은 조절해도 될까요?';
  }else if(c.follow===2){
    main='선생님, 어제 아팠던 곳이 오늘 아침에 더 아픕니다'; ask='훈련 전에 한번 봐 주실 수 있을까요?';
  }else if(c.status==='RED'){
    main='선생님, 오늘 컨디션이 많이 좋지 않습니다'; ask='오늘 운동을 조절해도 될까요?';
  }else if(c.status==='AMBER'){
    if(t.sorenessImpact===2){ main='선생님, 오늘 '+(c.sAreas?c.sAreas+' ':'')+'근육통 때문에 움직이기가 불편합니다'; ask='불편한 동작은 조절해도 될까요?'; }
    else if(c.sleepLow||c.isW('sleepMin')){ main='선생님, 어젯밤 '+fmtSleep(t.sleepMin)+'밖에 못 자서 컨디션이 저조합니다'; usedSleep=true; ask='오늘 운동량을 조절해도 될까요?'; }
    else { main='선생님, 오늘 컨디션이 저조합니다'; ask='오늘 운동량을 조절해도 될까요?'; }
  }else if(c.status==='YELLOW'){
    if(t.sorenessImpact>=1&&c.sAreas&&(c.isW('soreness')||!METRICS.some(m=>c.isW(m.key)))){ main='선생님, 오늘 '+josa(c.sAreas,'이','가')+' 조금 뻐근합니다'; }
    else main='선생님, 오늘 컨디션이 평소보다 조금 저조합니다';
    ask='훈련할 때 참고 부탁드립니다.';
  }
  if(!main) return null;
  if(!usedSleep&&(c.sleepLow||c.isW('sleepMin'))) facts.push('수면 '+fmtSleep(t.sleepMin));
  if(c.isW('fatigue')) facts.push('피로 높음');
  if(c.isW('readiness')||t.readiness<=2) facts.push('몸 무거움');
  if(t.pain&&t.sorenessImpact>=1&&c.sAreas) facts.push(c.sAreas+' 뻐근함');
  if(c.follow===1) facts.push('어제 통증이 아침에도 비슷함');
  return main+(facts.length?'('+facts.join(', ')+')':'')+'. '+ask;
}

/* ---- 오늘 몸관리: 영양 / 수면 / 회복 프로토콜 ----
   위에서부터 조건이 맞는 첫 프로토콜을 고른다. tag 가 겹치면 건너뛰어서 같은 조언이 두 번 나오지 않게 한다.
   메뉴는 날짜에 따라 돌아가며 바뀐다. 수치는 일반 제품 기준 대략값. */
function pickByDate(arr,date){ const n=Number(date.slice(5,7))*31+Number(date.slice(8,10)); return arr[n%arr.length]; }
const LEGACY_AREA={'허벅지':'허벅지 앞'};          // 예전 선택지 '허벅지' 는 '허벅지 앞' 으로 본다
function normAreas(a){ return [...new Set((a||[]).map(x=>LEGACY_AREA[x]||x))]; }
// 근육통 부위가 여러 곳이면 부상 위험이 큰 순서로 하나만 보여 준다

  {v:'2단계 스트레칭: 벽 밀고 뒷다리 무릎 편 채 30초 → 그대로 무릎 살짝 굽혀 30초, 양쪽'},

  {v:'마사지볼: 벽과 날개뼈 안쪽 사이에 공을 끼우고 무릎을 굽혔다 펴며 1~2분',alt:'네발 자세에서 한 팔을 반대쪽 팔 아래로 깊게 넣어 어깨와 등을 바닥에 대고 30초 × 양쪽 2회'},
  {v:'가슴 열기: 의자 등받이에 날개뼈 아래를 걸치고 손으로 머리를 받친 채 숨 내쉬며 가슴 젖히기 10회'},

const AREA_CARE={
  '정강이':CARE_SHIN,'무릎':CARE_KNEE,'허벅지 앞':CARE_KNEE,'허벅지 뒤':CARE_HAM,'허리':CARE_BACK,'엉덩이':CARE_GLUTE,
  '종아리':CARE_CALF,'발목':CARE_ANKLE,'발바닥':CARE_ANKLE,'어깨':CARE_SHOULDER,'등':CARE_SHOULDER,
  '목':{name:'목 관리',lines:[{v:'고개를 옆으로 기울여 30초 × 양쪽 2회'},{v:'따뜻한 수건 5분 올려 두기'}]},

};

function buildCare(c){
  const t=c.t, d=t.date||todayStr(), used=new Set();
  const sa=normAreas(t.sorenessAreas);
  const primary=t.soreness>0?AREA_ORDER.find(a=>sa.includes(a)):null;
  const limit=t.sorenessImpact>=2;
  const areaP=primary?{name:AREA_CARE[primary].name,lines:AREA_CARE[primary].lines.filter(l=>!(limit&&l.strength))}:null;

  const N=[
    {when:t.pain||c.follow===2, name:'회복 지원', lines:[
      {k:'끼니마다', v:'단백질 20~25g', m:'급식·집밥에서 고기·생선·계란·두부 반찬 먼저 먹기'},
      {k:'간식', v:'단백질과 칼슘 보충', m:pickByDate(['흰우유 1팩 + 구운계란 2개','닭가슴살 1팩 + 흰우유 1팩','스트링치즈 2개 + 두유 1팩'],d)}]},
    {when:c.tired, name:'에너지 보충', lines:[
      {k:'훈련 1~2시간 전', v:'탄수화물 약 50g', m:pickByDate(['바나나 2개','삼각김밥 1개 + 이온음료 반 병','카스텔라 1개 + 바나나우유 1개'],d)},
      {k:'훈련 후 1시간 안', v:'탄수화물 50g 이상, 단백질 20g 이상', m:pickByDate(['초코우유 2팩 + 구운계란 2개','김밥 1줄 + 단백질 음료 1개','삼각김밥 2개 + 구운계란 2개'],d)}]},
    {when:c.flag('soreness')||t.soreness>=5||t.sorenessImpact>=1, name:'근육 회복', lines:[
      {k:'훈련 후 1시간 안', v:'단백질 20~25g, 탄수화물 30~45g', m:pickByDate(['닭가슴살 1팩 + 군고구마 1개','단백질 음료 1개 + 바나나 1개','흰우유 2팩 + 구운계란 2개 + 바나나 1개'],d)},
      {k:'자기 1~2시간 전', v:'단백질 간식', m:'흰우유 1팩 또는 스트링치즈 2개'}]},
    {when:c.flag('stress')||c.flag('sleepQuality'), name:'안정과 숙면', lines:[
      {k:'오후 3시 이후', v:'카페인 끊기', m:'커피·에너지드링크·콜라 대신 물이나 이온음료'},
      {k:'자기 1~2시간 전', v:'가벼운 간식', m:'흰우유 1팩 + 바나나 반 개'}]},
    {when:true, name:'훈련 전후 기본', lines:[
      {k:'훈련 1~2시간 전', v:'탄수화물 30~40g', m:pickByDate(['바나나 1개 + 두유 1팩','삼각김밥 1개','카스텔라 1개 + 흰우유 1팩'],d)},
      {k:'훈련 후 1시간 안', v:'탄수화물 약 50g, 단백질 15g 이상', m:pickByDate(['초코우유 2팩 + 구운계란 1개','김밥 1줄 + 흰우유 1팩','삼각김밥 1개 + 바나나우유 1개 + 스트링치즈 1개'],d)}]}
  ];
  const R=[
    {when:t.pain||c.follow===2, name:'통증 관리', lines:[
      {v:'아픈 곳은 세게 주무르거나 뜨거운 찜질·사우나로 데우지 않기'},
      {v:'통증이 생기는 동작은 쉬고, 훈련 전에 선생님께 먼저 보여 드리기'},
      {v:'내일 아침 일어났을 때 아픈 곳이 어떤지 체크인에서 기록하기'},
      {v:'한 점이 콕 집히게 아프거나 밤에 욱신거리면 꼭 선생님께 말하기'}]},
    {when:!!areaP, ...areaP},
    {when:c.flag('stress'), tag:'breath', name:'호흡으로 긴장 풀기', lines:[
      {v:'코로 두 번 들이쉬고 입으로 길게 내쉬기 3회 (훈련 전·후)'}]},
    {when:c.tired, tag:'shower', name:'피로 회복', lines:[
      {v:'온냉 교대 샤워: 하체에 따뜻한 물 1분 30초 → 찬물 30초, 3~4번 반복'},
      {v:'다리를 벽에 올리고 5분 누워 있기'}]},
    {when:true, name:'기본 정리', lines:[
      {v:'훈련 후 맨몸 스트레칭 5~10분: 종아리 2단계, 허벅지 앞, 비둘기 자세 각 30초'},
      {v:'훈련 중·후 물 500ml 이상 나눠 마시기'}]}
  ];
  const S=[
    {when:c.sleepLow||c.flag('sleepMin'), name:'수면 보충', lines:[
      {v:'오늘은 평소보다 30분 일찍 눕기'},{v:'낮잠은 20분 이내, 오후 4시 전에만'}]},
    {when:c.flag('sleepQuality'), tag:'shower', name:'숙면 환경', lines:[
      {v:'자기 1시간 전 따뜻한 물(40℃ 정도)로 10분 샤워'},{v:'방은 어둡고 시원하게, 폰은 침대 밖에서 충전'}]},
    {when:c.flag('stress'), tag:'breath', name:'잠들기 전 긴장 풀기', lines:[
      {v:'누워서 4초 들이쉬고 6~8초 내쉬기 5분'},{v:'내일 할 일은 자기 전에 메모로 적어 두기'}]},
    {when:t.pain, name:'편한 자세로 자기', lines:[
      {v:'아픈 부위가 눌리지 않게 베개로 받치고 자기'}]},
    {when:c.flag('fatigue'), name:'회복 수면', lines:[
      {v:'7시간 이상 잘 수 있게 오늘 취침 시간 정해 두기'},{v:'자기 2시간 전부터 야식·라면 피하기'}]},
    {when:true, name:'수면 리듬', lines:[
      {v:'기상 시간은 주말에도 1시간 이상 바꾸지 않기'}]}
  ];
  /* --- 회복: 해당되는 것을 모두. 부위가 여러 곳이면 부위마다 (같은 관리법을 쓰는 부위는 한 번만) --- */
  const recovery=[];
  if(R[0].when) recovery.push(R[0]);                                   // 통증 관리
  const painSet=new Set(t.pain?normAreas(t.painAreas):[]);            // 아픈 부위는 마사지·강화 동작을 하면 안 되므로 제외
  if(t.soreness>0){
    const seen=new Set();
    AREA_ORDER.filter(a=>sa.includes(a)&&!painSet.has(a)).forEach(a=>{
      const P=AREA_CARE[a]; if(seen.has(P)) return; seen.add(P);
      recovery.push({name:P.name,lines:P.lines.filter(l=>!(limit&&l.strength))});
    });
  }
  R.slice(2,4).forEach(x=>{ if(x.when){ recovery.push(x); used.add(x.tag); } });   // 호흡, 피로 회복
  if(!recovery.length) recovery.push(R[4]);                             // 기본 정리

  /* --- 영양: 해당되는 것을 모두 합쳐 '하루 시간표' 로. 같은 시간대는 먼저 나온 것만 --- */
  const TIME_ORDER=['끼니마다','오후 3시 이후','훈련 1~2시간 전','훈련 후 1시간 안','간식','자기 1~2시간 전'];
  const nutHit=N.slice(0,4).filter(x=>x.when), nLines=[], nKeys=new Set();

let myStudent=null, myCheckins=[], form=null, trendChart=null, trendKey='fatigue', trendRange=14;

/* 휴대폰은 앱을 닫지 않고 '잠재워' 둔다. 다음 날 아침에 다시 열면 어제 화면이 '오늘'처럼 보이므로,
   다시 화면에 나타날 때 날짜가 바뀌었으면 기록을 새로 불러온다. */
async function refreshIfNewDay(fromTimer){
  if(!myStudent||saving||refreshing||loadedDate===todayStr()) return;
  // 체크인을 쓰는 중이면(하나라도 답했으면) 날짜가 바뀌어도 지우지 않는다. 저장은 누른 날짜로 된다.
  if(!$('screen-form').classList.contains('hidden')&&(fromTimer===true||(form&&answeredCount()>0))) return;
  if(!$('screen-perf').classList.contains('hidden')&&($('pf-val')&&$('pf-val').value||perf.saving)) return;   // 실기 기록을 적는 중이어도 지우지 않는다
  refreshing=true;
  try{ await enterApp(myStudent); }catch(e){ /* 다음 기회에 다시 시도 */ }
  finally{ refreshing=false; }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') refreshIfNewDay(); });
window.addEventListener('pageshow',e=>{ if(e.persisted) refreshIfNewDay(); });
window.addEventListener('focus',()=>refreshIfNewDay());
setInterval(()=>refreshIfNewDay(true),60000);

function loginWithGoogle(){
  $('login-error').textContent='';
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch(err=>{ $('login-error').textContent='로그인 실패: '+err.code; });
}
/* 속도: 이 기기에서 학생으로 들어온 적이 있으면 첫 화면(index.html)이 무거운 코치 파일을 받지 않고 바로 이 화면으로 보낸다.
   그 표시(heroRole)는 로그아웃하거나 학생이 아니면 지운다 → 첫 화면과 이 화면이 서로 계속 보내는 일이 없게. */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function goHome(){ lsDel('heroRole'); location.replace('./'); }
function readLinkCache(uid){ try{ const v=JSON.parse(lsGet('heroLink:'+uid)||'null'); return v&&typeof v.id==='string'?v:null; }catch(e){ return null; } }
function logout(){
  try{ Object.keys(localStorage).filter(k=>k.startsWith('heroLink:')).forEach(lsDel); }catch(e){}
  auth.signOut().then(goHome,goHome);
}

/* ============ 가입: 내 정보 → 반 코드 → 선생님 승인 ============
   joinRequests/{내 uid}  : 학생이 쓰는 가입 신청서 (코치 사이트가 읽어서 승인)
   links/{내 uid}         : 선생님이 승인하면 만들어지는 연결 문서 {studentId, name}
   settings/public        : 지점 목록 {branches:[...]} (누구나 읽기)
   settings/join          : 반 코드 {code} (학생은 못 읽음. 맞는지는 보안 규칙이 검사) */
const GRADES=['중1','중2','중3','고1','고2','고3','N수','기타'];
let profile=null, branches=[], unsubs=[];
function emptyProfile(){ return {name:'',grade:'',branch:'',targetSchool:'',injury:null,injuryNote:'',consent:false}; }
function stopListening(){ unsubs.forEach(u=>u()); unsubs=[]; }

async function loadBranches(){
  try{ const d=await db.collection('settings').doc('public').get(); branches=(d.exists&&Array.isArray(d.data().branches))?d.data().branches:[]; }
  catch(e){ branches=[]; }
}
function renderProfile(){
  const p=profile;
  $('pf-name').value=p.name;
  $('pf-school').value=p.targetSchool;
  $('pf-grade').innerHTML=GRADES.map(g=>`<button type="button" class="chip ${p.grade===g?'on':''}" aria-pressed="${p.grade===g}" data-g="${g}">${g}</button>`).join('');
  $('pf-branch-box').innerHTML=branches.length
    ? `<select id="pf-branch" class="txt"><option value="">지점 선택</option>${branches.map(b=>`<option ${p.branch===b?'selected':''}>${esc(b)}</option>`).join('')}</select>`
    : `<input id="pf-branch" class="txt" maxlength="20" placeholder="다니는 지점 이름" value="${esc(p.branch)}">`;
  $('pf-injury').innerHTML=[['없음',false],['있음',true]].map(([t,v])=>`<button type="button" class="chip ${v?'pain':''} ${p.injury===v?'on':''}" aria-pressed="${p.injury===v}" data-inj="${v}">${t}</button>`).join('');
  $('pf-injury-note-box').innerHTML=p.injury?`<input id="pf-injury-note" class="txt" style="margin-top:10px" maxlength="100" placeholder="예: 작년 여름 오른쪽 발목 염좌" value="${esc(p.injuryNote)}" aria-label="부상 이력 내용">`:'';
  $('pf-consent').checked=p.consent;
}
function readProfileInputs(){
  profile.name=$('pf-name').value.trim();
  profile.targetSchool=$('pf-school').value.trim();
  profile.branch=($('pf-branch').value||'').trim();
  if($('pf-injury-note')) profile.injuryNote=$('pf-injury-note').value.trim();
  profile.consent=$('pf-consent').checked;
}
$('screen-profile').addEventListener('click',e=>{
  const g=e.target.closest('[data-g]'), inj=e.target.closest('[data-inj]');
  if(!g&&!inj) return;
  readProfileInputs();
  if(g) profile.grade=g.dataset.g;
  if(inj){ profile.injury=inj.dataset.inj==='true'; if(!profile.injury) profile.injuryNote=''; }
  renderProfile();
  const again=$('screen-profile').querySelector(g?`[data-g="${g.dataset.g}"]`:`[data-inj="${inj.dataset.inj}"]`); if(again) again.focus({preventScroll:true});
});
function profileNext(){
  readProfileInputs();
  const p=profile, err=$('pf-error'), miss=[];
  if(p.name.length<2) miss.push('이름(2자 이상)');
  if(!p.grade) miss.push('학년');
  if(!p.branch) miss.push('지점');
  if(!p.consent) miss.push('동의 체크');
  if(miss.length){ err.textContent='아직 입력하지 않은 항목이 있어요: '+miss.join(', '); return; }
  err.textContent='';
  $('code-error').textContent='';
  show('screen-join');
}
async function sendJoinRequest(){
  const errBox=$('code-error'), btn=$('join-btn');
  const code=$('code-input').value.trim().toUpperCase();
  errBox.textContent='';
  if(!/^[A-Z0-9]{4,12}$/.test(code)){ errBox.textContent='반 코드는 영문과 숫자로 된 4~12자리예요.'; return; }
  btn.disabled=true;
  let old=null;
  try{
    const u=auth.currentUser, ref=db.collection('joinRequests').doc(u.uid);
    old=await ref.get();
    const p=profile;
    await ref.set({
      name:p.name, grade:p.grade, branch:p.branch, targetSchool:p.targetSchool,
      injury:p.injury, injuryNote:p.injury?p.injuryNote:'', consent:true,
      email:u.email, code, status:'pending',
      createdAt:old.exists&&old.data().createdAt?old.data().createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    waitForApproval();
  }catch(e){
    // '권한 없음'은 반 코드가 틀렸을 때 말고도, 이미 승인된 신청서를 다시 쓰려 할 때도 생긴다 → 경우를 나눠서 안내
    const approved=old&&old.exists&&old.data().status==='approved';
    errBox.textContent=e.code==='permission-denied'
      ?(approved?'이미 승인된 신청이에요. 선생님께 "학생 연결을 확인해 주세요"라고 말씀해 주세요.':'반 코드가 맞지 않아요. 선생님께 다시 확인해 보세요.')
      :e.code==='unavailable'?'인터넷 연결이 불안정해요. 잠시 뒤 다시 눌러 주세요.':'요청 실패: '+(e.code||e.message);
  }finally{ btn.disabled=false; }
}
function summaryHTML(r){
  const rows=[['이름',r.name],['학년',r.grade],['지점',r.branch],['목표 학교',r.targetSchool||'-'],['부상 이력',r.injury===true?('있음'+(r.injuryNote?' · '+r.injuryNote:'')):r.injury===false?'없음':'-']];
  return rows.map(([k,v])=>`<div class="kv"><b>${k}</b><span>${esc(v)}</span></div>`).join('');
}
// 승인 대기: links(승인) 와 joinRequests(반려) 를 실시간으로 지켜본다
function waitForApproval(){
  stopListening();
  const uid=auth.currentUser.uid;
  show('screen-wait');
  unsubs.push(db.collection('joinRequests').doc(uid).onSnapshot(d=>{
    if(!d.exists) return;
    const r=d.data();
    $('wait-summary').innerHTML=summaryHTML(r);
    if(r.status==='rejected'){ stopListening(); openProfile(r); }
  },()=>{}));
  unsubs.push(db.collection('links').doc(uid).onSnapshot(async d=>{
    if(!d.exists) return;
    stopListening();
    try{ await enterApp({id:d.data().studentId,name:d.data().name}); }
    catch(e){ $('wait-error').innerHTML='승인은 됐는데 기록을 불러오지 못했어요 ('+esc(e.code||e.message||'')+'). <button class="link" onclick="location.reload()">다시 시도</button>'; }
  },()=>{}));
}
async function openProfile(req){
  await loadBranches();
  profile=req?{name:req.name||'',grade:req.grade||'',branch:req.branch||'',targetSchool:req.targetSchool||'',injury:req.injury??null,injuryNote:req.injuryNote||'',consent:!!req.consent}:emptyProfile();
  $('reject-box').innerHTML=req&&req.status==='rejected'
    ?`<div class="reject"><b>승인되지 않았어요.</b> ${esc(req.rejectReason||'정보를 확인하고 다시 보내 주세요.')}</div>`:'';
  renderProfile(); show('screen-profile');
}
async function editRequest(){
  stopListening();
  const d=await db.collection('joinRequests').doc(auth.currentUser.uid).get();
  openProfile(d.exists?d.data():null);
}
/* 홈 화면에 추가 안내 (I8): 아이콘을 누르면 지금 쓰는 브라우저로 바로 열린다 → 로그인도 그대로 */
function installHTML(){

  const inApp=/KAKAOTALK|Instagram|FBAN|FBAV|NAVER|Line\//i.test(ua);
  const steps=inApp?['먼저 오른쪽 위(또는 아래) 메뉴에서 <b>다른 브라우저로 열기</b>를 눌러요','Safari나 Chrome에서 아래 순서대로 해요']
    :ios?['Safari 아래쪽 <b>공유 버튼</b>(네모에 위 화살표)을 눌러요','목록에서 <b>홈 화면에 추가</b>를 눌러요','오른쪽 위 <b>추가</b>를 누르면 끝']
    :['Chrome 오른쪽 위 <b>⋮ 메뉴</b>를 눌러요','<b>홈 화면에 추가</b>를 눌러요','<b>추가</b>를 누르면 끝'];
  return `<b>홈 화면에 HERO 아이콘 만들기</b><p class="note" style="margin:4px 0 0">매일 체크인할 때 주소를 찾지 않아도 돼요.</p><ol>${steps.map(x=>`<li>${x}</li>`).join('')}</ol>`;
}
async function openMe(){
  const d=await db.collection('joinRequests').doc(auth.currentUser.uid).get();
  $('me-summary').innerHTML=d.exists?summaryHTML(d.data()):`<div class="kv"><b>이름</b><span>${esc(myStudent.name)}</span></div>`;
  $('me-install').innerHTML=installHTML();
  show('screen-me');
}

auth.onAuthStateChanged(async user=>{
  stopListening();
  // 로그인 안 됨 → 첫 화면(코치·학생 공용 로그인)으로. 코치 계정이면 코치 화면으로.
  if(!user){ myStudent=null; myCheckins=[]; goHome(); return; }
  if(((user.providerData||[])[0]||{}).providerId!=='google.com'){ goHome(); return; }
  lsSet('heroRole','student');
  $('user-email').textContent=user.email;
  $('load-msg').textContent='기록 불러오는 중...';
  show('screen-loading');
  try{
    // 속도: 지난번에 기억해 둔 학생 번호가 있으면, 연결 확인과 체크인 불러오기를 '동시에' 한다 (기다리는 시간 1번 줄임)
    const cached=readLinkCache(user.uid);
    const linkP=db.collection('links').doc(user.uid).get();
    const ckP=cached?fetchCheckins(cached.id):null;
    if(ckP) ckP.catch(()=>{});
    const link=await linkP;
    if(link.exists){
      const st={id:link.data().studentId,name:link.data().name};
      lsSet('heroLink:'+user.uid,JSON.stringify(st));
      await enterApp(st,cached&&cached.id===st.id?ckP:null);
      return;
    }
    lsDel('heroLink:'+user.uid);
    const req=await db.collection('joinRequests').doc(user.uid).get();
    if(req.exists&&req.data().status==='pending') waitForApproval();
    else await openProfile(req.exists?req.data():null);
  }catch(err){
    $('load-msg').innerHTML='불러오지 못했어요: '+esc(err.code||'')+'<br><span class="note">'+esc(err.message||'')+'</span><br><button class="link" onclick="location.reload()">다시 시도</button>';
    show('screen-loading');
  }
});

// 평소 기준(28일) + 오늘 = 29일치만 읽는다 (최대 29개 문서). 문서 ID 가 날짜라서 색인 없이 범위 조회 가능.
async function fetchCheckins(sid){
  const from=addDays(todayStr(),-BASELINE_WINDOW_DAYS);
  const snap=await db.collection('students').doc(sid).collection('checkins')
    .where(firebase.firestore.FieldPath.documentId(),'>=',from).get();
  return snap.docs.map(d=>({...d.data(),date:d.id})).sort((a,b)=>a.date.localeCompare(b.date));
}
async function enterApp(student,ckPromise){
  myStudent=student;
  let list=null;
  if(ckPromise){ try{ list=await ckPromise; }catch(e){ list=null; } }   // 미리 불러온 게 실패하면 다시 불러온다
  if(!list) list=await fetchCheckins(student.id);
  myCheckins=list;
  loadedDate=todayStr();
  showResult();
  loadPerfData();                    // 실기 기록은 체크인 화면을 먼저 보여 준 뒤 뒤에서 불러온다
  ensureChart().catch(()=>{});       // 그래프 파일도 화면이 뜬 다음에 받는다
}

/* ============ 체크인 폼 ============ */
function emptyForm(){
  return {sleepH:null,sleepM:0,sleepQuality:null,fatigue:null,soreness:null,sorenessAreas:[],sorenessImpact:null,
          stress:null,stressCauses:[],readiness:null,pain:null,painAreas:[],painLevel:null,painNote:'',painFollowUp:null};
}
function formFromDoc(c){
  const total=Math.round(c.sleepMin/10)*10;   // 전체 분을 먼저 10분 단위로 맞춘 뒤 시간/분으로 나눈다
  return {sleepH:Math.floor(total/60),sleepM:total%60,sleepQuality:c.sleepQuality,fatigue:c.fatigue,
          soreness:c.soreness,sorenessAreas:normAreas(c.sorenessAreas),sorenessImpact:c.sorenessImpact,stress:c.stress,
          stressCauses:c.stressCauses||[],readiness:c.readiness,pain:c.pain,painAreas:normAreas(c.painAreas),
          painLevel:c.painLevel,painNote:c.painNote||'',painFollowUp:c.painFollowUp??null};
}
let formDate=null;   // 쓰다 만 체크인: 다른 메뉴에 다녀와도 오늘 적던 답은 그대로 둔다
function openForm(keepDraft){
  const t=myCheckins.find(c=>c.date===todayStr());
  if(!(keepDraft&&!t&&form&&formDate===todayStr())){ form=t?formFromDoc(t):emptyForm(); formDate=todayStr(); }
  renderForm(); show('screen-form');
}

function scale(key,lo,hi,cls,label){
  let b=''; for(let i=0;i<=10;i++) b+=`<button type="button" class="${form[key]===i?'on':''}" aria-pressed="${form[key]===i}" data-a="set" data-k="${key}" data-v="${i}">${i}</button>`;
  return `<div class="scale ${cls||''}" role="group" aria-label="${label||''} 0점 ${lo}, 10점 ${hi}">${b}</div><div class="anchors"><span>${lo}</span><span>${hi}</span></div>`;
}
function chips(key,list,cls){
  return `<div class="chips">`+list.map(x=>`<button class="chip ${cls||''} ${form[key].includes(x)?'on':''}" aria-pressed="${form[key].includes(x)}" data-a="toggle" data-k="${key}" data-v="${x}">${x}</button>`).join('')+`</div>`;
}
function yesterdayPain(){ const y=myCheckins.find(c=>c.date===addDays(todayStr(),-1)); return y&&y.pain?y:null; }
function missing(){
  const m=[];
  if(yesterdayPain()&&form.painFollowUp===null) m.push(['q-fu','어제 통증 확인']);
  if(form.sleepH===null) m.push(['q-sleep','수면 시간']);
  if(form.sleepQuality===null) m.push(['q-sq','수면의 질']);
  if(form.fatigue===null) m.push(['q-fa','피로']);
  if(form.soreness===null) m.push(['q-so','근육통']);
  else if(form.soreness>0){
    if(!form.sorenessAreas.length) m.push(['q-so','근육통 부위']);   // 부위가 있어야 선생님 화면의 '불편 부위'와 확인 포인트가 채워진다
    if(form.sorenessImpact===null) m.push(['q-so','근육통 동작 영향']);
  }
  if(form.stress===null) m.push(['q-st','스트레스']);
  if(form.readiness===null) m.push(['q-re','준비도']);
  if(form.pain===null) m.push(['q-pa','통증']);
  else if(form.pain&&(!form.painAreas.length||form.painLevel===null)) m.push(['q-pa','통증 부위와 강도']);
  return m;
}
// 답해야 할 칸 목록 (근육통·통증이 있으면 부위 같은 세부 칸이, 어제 통증이 있으면 아침 질문이 더 생긴다)
function requiredChecks(){
  const c=[form.sleepH!==null,form.sleepQuality!==null,form.fatigue!==null,form.soreness!==null,form.stress!==null,form.readiness!==null,form.pain!==null];
  if(form.soreness>0) c.push(form.sorenessAreas.length>0, form.sorenessImpact!==null);
  if(form.pain) c.push(form.painAreas.length>0, form.painLevel!==null);
  if(yesterdayPain()) c.push(form.painFollowUp!==null);
  return c;
}
function answeredCount(){ return requiredChecks().filter(Boolean).length; }
function renderForm(){
  const y=window.scrollY;
  const hOpts='<option value="">시간</option>'+Array.from({length:15},(_,i)=>`<option value="${i}" ${form.sleepH===i?'selected':''}>${i}시간</option>`).join('');
  const mOpts=[0,10,20,30,40,50].map(i=>`<option value="${i}" ${form.sleepM===i?'selected':''}>${i}분</option>`).join('');
  const n=answeredCount(), total=requiredChecks().length;
  $('screen-form').innerHTML=`
    <div class="head"><div><h1>${esc(myStudent.name||'학생')}님, 오늘 체크인</h1>
      <div class="date">${new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})} · 1분이면 끝나요</div></div>
      ${myCheckins.some(c=>c.date===todayStr())?'<div class="head-actions"><button class="link" data-a="back">취소</button></div>':''}</div>

    ${yesterdayPain()?`<div class="q" id="q-fu"><div class="q-title">어제 아팠던 ${esc((yesterdayPain().painAreas||[]).join('·')||'곳')}, 오늘 아침 일어났을 때 어땠나요?</div>
      <div class="chips">${['괜찮아졌어요','비슷해요','더 아파요'].map((x,i)=>`<button class="chip ${i===2?'pain':''} ${form.painFollowUp===i?'on':''}" aria-pressed="${form.painFollowUp===i}" data-a="set" data-k="painFollowUp" data-v="${i}">${x}</button>`).join('')}</div></div>`:''}
    <div class="q" id="q-sleep"><div class="q-title">어젯밤 실제로 얼마나 잤나요?</div><div class="q-hint">침대에 누운 시간이 아니라 잠든 시간</div>
      <div class="sleep-row"><select data-a="sleep" data-k="sleepH" aria-label="수면 시간(시간)">${hOpts}</select><select data-a="sleep" data-k="sleepM" aria-label="수면 시간(분)">${mOpts}</select></div></div>

    <div class="q" id="q-sq"><div class="q-title">일어난 뒤 수면의 질을 어떻게 평가하나요?</div>${scale('sleepQuality','최악','최고','','수면의 질')}</div>

    <div class="q" id="q-fa"><div class="q-title">지금 전반적으로 느끼는 신체 피로는?</div>${scale('fatigue','전혀 피곤하지 않음','극심','','피로')}</div>

    <div class="q" id="q-so"><div class="q-title">오늘 근육의 뻐근함/통증은?</div><div class="q-hint">훈련 후 근육이 당기고 뻐근한 정도</div>${scale('soreness','없음','매우 심함','','근육통')}
      ${form.soreness>0?`<div class="sub-q">어느 부위인가요? <b style="color:var(--lime);font-weight:600;">필수</b> · 여러 개 선택 가능</div>${chips('sorenessAreas',BODY_PARTS)}
      <div class="sub-q">움직임에 얼마나 영향을 주나요?</div><div class="chips">${IMPACTS.map((x,i)=>`<button class="chip ${form.sorenessImpact===i?'on':''}" aria-pressed="${form.sorenessImpact===i}" data-a="set" data-k="sorenessImpact" data-v="${i}">${x}</button>`).join('')}</div>`:''}</div>

    <div class="q" id="q-st"><div class="q-title">오늘 심리적 스트레스는?</div>${scale('stress','없음','매우 심함','','스트레스')}
      ${form.stress>0?`<div class="sub-q">원인이 있다면 골라 주세요 (선택)</div>${chips('stressCauses',STRESS_CAUSES)}`:''}</div>

    <div class="q" id="q-re"><div class="q-title">훈련을 시작한다고 생각하면 몸이 얼마나 준비된 느낌인가요?</div>${scale('readiness','전혀 준비 안 됨','완벽히 준비됨','','준비도')}</div>

    <div class="q" id="q-pa"><div class="q-title">아픈 곳이 있나요?</div><div class="q-hint">근육 뻐근함과 별개로, 관절·뼈 등 평소와 다른 아픔</div>
      <div class="chips" style="margin-top:0"><button class="chip ${form.pain===false?'on':''}" aria-pressed="${form.pain===false}" data-a="pain" data-v="0">없음</button><button class="chip pain ${form.pain===true?'on':''}" aria-pressed="${form.pain===true}" data-a="pain" data-v="1">있음</button></div>
      ${form.pain?`<div class="sub-q">어느 부위인가요?</div>${chips('painAreas',BODY_PARTS,'pain')}
      <div class="sub-q">아픈 정도는?</div>${scale('painLevel','약함','매우 심함','pain','통증 정도')}
      <textarea class="memo" data-a="memo" aria-label="통증 메모" maxlength="200" placeholder="언제부터, 어떤 동작에서 아픈지 적어 주세요 (선택)">${esc(form.painNote)}</textarea>`:''}</div>

    <div class="submit-bar"><div class="progress"><i style="width:${Math.round(n/total*100)}%"></i></div>
      <button class="btn" data-a="submit">${n<total?'저장하기 ('+(total-n)+'개 남음)':'저장하고 내 상태 보기'}</button>
      <div id="form-err" class="err" role="alert"></div></div>`;
  window.scrollTo(0,y);
}

function refocus(a,k,v){
  const sel=`[data-a="${a}"]`+(k?`[data-k="${k}"]`:'')+(v!=null?`[data-v="${v}"]`:'');
  const b=$('screen-form').querySelector(sel); if(b) b.focus({preventScroll:true});
}
$('screen-form').addEventListener('click',e=>{
  if(saving) return;   // 저장 중에 다시 그리면 저장 버튼이 다시 눌리는 상태가 되므로 막는다
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a, k=el.dataset.k, v=el.dataset.v;
  setTimeout(()=>{ if(a==='set'||a==='toggle'||a==='pain') refocus(a,k,v); },0);
  if(a==='set'){ form[k]=Number(v); if(k==='soreness'&&form.soreness===0){ form.sorenessAreas=[]; form.sorenessImpact=null; } if(k==='stress'&&form.stress===0) form.stressCauses=[]; renderForm(); }
  else if(a==='toggle'){ const arr=form[k], i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); renderForm(); }
  else if(a==='pain'){ form.pain=v==='1'; if(!form.pain){ form.painAreas=[]; form.painLevel=null; form.painNote=''; } renderForm(); }
  else if(a==='back'){ showResult(); }
  else if(a==='submit'){ submitCheckin(); }
});
$('screen-form').addEventListener('change',e=>{
  const el=e.target; if(el.dataset.a!=='sleep'||saving) return;
  form[el.dataset.k]=el.value===''?null:Number(el.value); renderForm();
});
$('screen-form').addEventListener('input',e=>{ if(e.target.dataset.a==='memo') form.painNote=e.target.value; });

async function submitCheckin(){
  const miss=missing(), err=$('form-err');
  if(miss.length){
    err.textContent='아직 답하지 않은 항목이 있어요: '+miss.map(x=>x[1]).join(', ');
    $(miss[0][0]).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'}); return;
  }
  const date=todayStr(), s=form.soreness>0, st=form.stress>0, p=form.pain;
  const data={
    date, sleepMin:form.sleepH*60+form.sleepM, sleepQuality:form.sleepQuality, fatigue:form.fatigue,
    soreness:form.soreness, sorenessAreas:s?form.sorenessAreas:[], sorenessImpact:s?form.sorenessImpact:null,
    stress:form.stress, stressCauses:st?form.stressCauses:[], readiness:form.readiness,
    pain:p, painAreas:p?form.painAreas:[], painLevel:p?form.painLevel:null, painNote:p?Array.from(form.painNote.trim()).slice(0,200).join(''):'',
    painFollowUp:yesterdayPain()?form.painFollowUp:null
  };
  const j=judge(data,analyze(data,historyFor(date)));
  data.status=j.status; data.reasons=j.reasons; data.studentId=myStudent.id;   // 코치 화면에서 바로 쓰도록 판정 결과도 저장
  // 인터넷이 끊긴 상태면 저장 버튼이 영원히 '기다리는 중'으로 멈춘 것처럼 보이므로 먼저 알려 준다
  if(navigator.onLine===false){ err.textContent='인터넷이 끊겨 있어요. 와이파이나 데이터를 켠 뒤 다시 눌러 주세요.'; return; }
  const btn=document.querySelector('[data-a="submit"]'); btn.disabled=true; btn.textContent='저장하는 중...'; err.textContent='';
  saving=true;
  const slow=setTimeout(()=>{ err.textContent='인터넷이 느려서 저장이 늦어지고 있어요. 이 화면을 닫지 말고 잠시 기다려 주세요.'; },8000);
  try{
    await db.collection('students').doc(myStudent.id).collection('checkins').doc(date)
      .set({...data,checkedAt:firebase.firestore.FieldValue.serverTimestamp()});
    clearTimeout(slow); saving=false;
    myCheckins=myCheckins.filter(c=>c.date!==date).concat([data]).sort((a,b)=>a.date.localeCompare(b.date));
    showResult();
  }catch(e){ clearTimeout(slow); saving=false; err.textContent='저장 실패: '+(e.code||e.message)+' · 다시 눌러 주세요.'; btn.disabled=false; btn.textContent='다시 저장하기'; }
}

/* ============ 결과 화면 ============ */
function historyFor(date){
  const from=addDays(date,-BASELINE_WINDOW_DAYS);
  return myCheckins.filter(c=>c.date<date&&c.date>=from);
}
function careLines(lines){
  return lines.map(l=>`<div class="care-l">${l.k?`<span class="care-k">${esc(l.k)}</span>`:''}${esc(l.v)}${l.m?`<div class="care-m">${esc(l.m)}</div>`:''}${l.alt?`<div class="care-m">볼이 없으면 · ${esc(l.alt)}</div>`:''}</div>`).join('');
}
function rowHTML(r,today,ready){
  const m=r.m, ctx=[];
  const sa=today.sorenessAreas||[], sc=today.stressCauses||[];   // 예전 기록에 칸이 없어도 멈추지 않게
  if(m.key==='soreness'&&today.soreness>0){ if(sa.length) ctx.push(sa.join('·')); if(today.sorenessImpact!=null&&IMPACTS[today.sorenessImpact]) ctx.push('움직임 영향 '+IMPACTS[today.sorenessImpact]); }
  if(m.key==='stress'&&sc.length) ctx.push(sc.join('·'));
  const ctxH=ctx.length?`<div class="row-ctx">${esc(ctx.join(' · '))}</div>`:'';
  if(!ready){
    const pct=m.key==='sleepMin'?Math.min(100,r.value/600*100):r.value*10;
    return `<div class="row"><div class="row-top"><span class="row-label">${m.label}</span><span class="row-val">${fmtValue(m.key,r.value)}</span></div>
      <div class="pb"><i style="width:${pct}%"></i></div>${ctxH}</div>`;
  }
  const w=Math.min(Math.abs(r.score),3)/3*50, left=r.delta<0?50-w:50;
  const tagCls=r.tone==='better'?'tag-better':r.tone==='worse'?'tag-worse':'';
  const tagTxt=r.tone==='better'?'평소보다 좋음':r.tone==='worse'?'평소보다 주의':'평소와 비슷';
  return `<div class="row"><div class="row-top"><span class="row-label">${m.label}</span><span class="row-val">${fmtValue(m.key,r.value)}</span></div>
    <div class="dv"><div class="dv-mid"></div><div class="dv-fill ${r.tone}" style="left:${left}%;width:${w}%"></div></div>
    <div class="row-sub"><span>${fmtDelta(m.key,r.delta)}</span><span class="${tagCls}">${tagTxt}</span></div>${ctxH}</div>`;
}
let detailOpen=false;   // '내 상태 자세히' 펼침 상태 (다시 그려도 유지)

  const date=todayStr(), today=myCheckins.find(c=>c.date===date);

    ${todoHTML(j,today)}

    <div class="sec"><div class="sec-t">오늘 훈련 참고</div><p>${esc(j.train)}</p></div>
    ${j.coachTalk?`<div class="sec"><h2 class="sec-t">선생님께 드릴 말</h2><div class="talk" id="talk">${esc(j.coachTalk)}</div>

    <div class="sec" style="margin-top:0"><div class="sec-t">${an.ready?'평소(최근 '+BASELINE_WINDOW_DAYS+'일)와 비교':'오늘 기록 · 평소 비교는 최근 '+BASELINE_WINDOW_DAYS+'일 중 '+BASELINE_MIN_DAYS+'번 기록하면 시작 ('+hist.length+'/'+BASELINE_MIN_DAYS+')'}</div>
      ${an.rows.map(r=>rowHTML(r,today,an.ready)).join('')}</div>

      <div class="range"><button class="chip ${trendRange===7?'on':''}" data-range="7">7일</button><button class="chip ${trendRange===14?'on':''}" data-range="14">14일</button><button class="chip ${trendRange===28?'on':''}" data-range="28">28일</button></div>
      <div class="chart-box"><canvas id="trend" role="img" aria-label="${METRICS.find(m=>m.key===trendKey).label} 최근 ${trendRange}일 추이 그래프"></canvas></div>

/* ---- 오늘 할 것: 오늘 꼭 할 2~4가지만 체크 칸으로 (자세한 건 몸관리 화면) ---- */
function todoItems(j,t){
  const items=[];
  if(['RED','AMBER'].includes(j.status)||t.pain) items.push({id:'talk',k:'훈련 전',v:'선생님께 오늘 몸 상태 직접 말하기'});
  const rec=j.care.recovery[0];
  if(rec&&rec.lines[0]) items.push({id:'rec',k:'회복 · '+rec.name,v:rec.lines[0].v,to:'recovery'});
  const nl=j.care.nutrition.lines, n=nl.find(l=>l.k==='훈련 후 1시간 안')||nl[0];
  if(n) items.push({id:'nut',k:'영양 · '+n.k,v:n.m?n.m:n.v,to:'nutrition'});
  const sl=j.care.sleep.lines[0];
  if(sl) items.push({id:'sleep',k:'수면 · '+j.care.sleep.names[0],v:sl.v,to:'sleep'});
  return items.slice(0,4);
}
function todoKey(){ return 'heroTodo:'+((auth.currentUser&&auth.currentUser.uid)||'')+':'+todayStr(); }
function todoDone(){ try{ const v=JSON.parse(lsGet(todoKey())||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function todoHTML(j,t){
  const items=todoItems(j,t), done=todoDone(), n=items.filter(x=>done.includes(x.id)).length;
  return `<div class="todo-box" id="todo"><div class="todo-h"><b>오늘 할 것</b><span>${n===items.length?'다 했어요 👏':n+'/'+items.length+' 완료'}</span></div>
    ${items.map(x=>{ const d=done.includes(x.id); return `<div class="todo ${d?'done':''}"><button class="todo-c" data-a="todo" data-id="${x.id}" role="checkbox" aria-checked="${d}"><i aria-hidden="true">${d?'✓':''}</i><span><span class="k">${esc(x.k)}</span><span class="v">${esc(x.v)}</span></span></button>${x.to?`<button class="todo-more" data-a="care" data-tab="${x.to}" aria-label="${esc(x.k)} 자세히">자세히 ›</button>`:''}</div>`; }).join('')}
  </div>`;
}
function toggleTodo(id){
  const d=todoDone(), i=d.indexOf(id); if(i>=0) d.splice(i,1); else d.push(id);
  lsSet(todoKey(),JSON.stringify(d));
  const date=todayStr(), t=myCheckins.find(c=>c.date===date); if(!t) return;
  const box=$('todo'); if(box){ box.outerHTML=todoHTML(judge(t,analyze(t,historyFor(date))),t); const b=document.querySelector(`[data-a="todo"][data-id="${id}"]`); if(b) b.focus({preventScroll:true}); }
}

/* ---- 이번 주 체크인 (월~일) + 지난주와 비교 ---- */
function weekStats(mon){
  const days=[...Array(7)].map((_,i)=>addDays(mon,i)), list=myCheckins.filter(c=>days.includes(c.date));
  const avg=k=>list.length?list.reduce((a,c)=>a+c[k],0)/list.length:null;
  return {days,n:list.length,sleep:avg('sleepMin'),ready:avg('readiness')};
}
function weekHTML(){
  const today=todayStr(), dow=(new Date(today+'T00:00:00').getDay()+6)%7, mon=addDays(today,-dow);
  const has=new Set(myCheckins.map(c=>c.date)), w=weekStats(mon), lw=weekStats(addDays(mon,-7));
  let streak=w.n>=2?1:0;   // 주 2번 이상 체크인한 주가 몇 주 이어졌나 (불러온 28일 안에서)
  for(let k=1;k<=3;k++){ if(weekStats(addDays(mon,-7*k)).n>=2) streak++; else break; }
  const label=['월','화','수','목','금','토','일'];
  const dots=w.days.map((d,i)=>`<div class="${has.has(d)?'on':''} ${d===today?'today':''}">${label[i]}<i>${has.has(d)?'✓':''}</i></div>`).join('');
  const lines=[];
  lines.push(`이번 주 체크인 <b>${w.n}번</b> · 목표 주 3번${w.n>=3?' 달성 ✓':''}`);
  if(streak>=2) lines.push(`주 2번 이상 체크인 <b>${streak}주 연속</b>이에요`);
  if(w.n>=2&&lw.n>=2){
    const ds=Math.round(w.sleep-lw.sleep), dr=w.ready-lw.ready;
    lines.push(`지난주보다 평균 수면 <b>${Math.abs(ds)<10?'비슷':(ds>0?'+':'−')+(Math.abs(ds)<60?Math.abs(ds)+'분':fmtSleep(Math.abs(ds)))}</b> · 준비도 <b>${Math.abs(dr)<0.3?'비슷':(dr>0?'+':'−')+Math.abs(dr).toFixed(1)}</b>`);
  }
  return `<div class="sec-t">이번 주</div><div class="week" role="img" aria-label="이번 주 체크인 ${w.n}번">${dots}</div><div class="week-s">${lines.join('<br>')}</div>`;
}

/* ============ 몸관리 화면 (영양 · 수면 · 회복 탭) ============ */
let careTab='nutrition';
function openCare(tab){ if(tab) careTab=tab; renderCare(); show('screen-care'); }
function renderCare(){
  const date=todayStr(), t=myCheckins.find(c=>c.date===date);
  const head=`<div class="head"><h1>오늘 몸관리</h1><div class="date">${new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}</div></div>`;
  if(!t){ $('screen-care').innerHTML=head+`<div class="box" style="margin-top:14px">오늘 체크인을 하면 내 몸 상태에 맞춘 <b>영양·수면·회복</b> 관리법이 나와요.</div><button class="btn" style="margin-top:14px" data-c="checkin">체크인 하기</button>`; return; }
  const j=judge(t,analyze(t,historyFor(date))), ui=STATUS_UI[j.status], c=j.care;
  const tabs=[['nutrition','영양',''],['sleep','수면',''],['recovery','회복',c.recovery.length>1?' <small>'+c.recovery.length+'</small>':'']];
  let body='';
  if(careTab==='nutrition') body=`<div class="ccard"><h3>${esc(c.nutrition.names.join(' · '))}</h3><div class="ctime">${careLines(c.nutrition.lines)}</div></div>
    <p class="note" style="margin-top:12px">음식 수치는 편의점 일반 제품 기준 대략값이에요. 삼각김밥은 참치마요처럼 마요네즈가 많은 것보다 비빔·불고기류를 골라요. 알레르기가 있으면 선생님과 바꿔요.</p>`;
  else if(careTab==='sleep') body=`<div class="ccard"><h3>${esc(c.sleep.names.join(' · '))}</h3><ul>${c.sleep.lines.map(l=>`<li>${esc(l.v)}</li>`).join('')}</ul></div>`;
  else body=c.recovery.map(r=>`<div class="ccard"><h3>${esc(r.name)}</h3><ul>${r.lines.map(l=>`<li>${esc(l.v)}${l.m?`<div class="care-m">${esc(l.m)}</div>`:''}${l.alt?`<div class="care-m">볼이 없으면 · ${esc(l.alt)}</div>`:''}</li>`).join('')}</ul></div>`).join('');
  $('screen-care').innerHTML=head+`<div class="cstate"><b style="color:${ui.color};border-color:${ui.color}">${ui.label}</b><span>${esc(j.headline)}</span></div>
    <div class="seg" role="tablist" aria-label="몸관리 종류">${tabs.map(([k,l,x])=>`<button role="tab" aria-selected="${careTab===k}" data-c="tab" data-tab="${k}">${l}${x}</button>`).join('')}</div>
    <div role="tabpanel">${body}</div>`;
}
$('screen-care').addEventListener('click',e=>{

  if(el.dataset.c==='tab'){ careTab=el.dataset.tab; renderCare(); const b=document.querySelector(`#screen-care [data-tab="${careTab}"]`); if(b) b.focus({preventScroll:true}); }

/* ============ 아래 메뉴 ============ */
$('bnav').addEventListener('click',e=>{

$('screen-result').addEventListener('click',e=>{

  if(el.dataset.a==='edit') openForm();
  else if(el.dataset.a==='todo') toggleTodo(el.dataset.id);
  else if(el.dataset.a==='care') openCare(el.dataset.tab);
  else if(el.dataset.a==='perf') openPerf();

  else if(el.dataset.a==='logout'){ if(confirm('로그아웃할까요? 다시 들어올 때 구글 로그인이 필요해요.')) logout(); }
  else if(el.dataset.a==='me') openMe();
  else if(el.dataset.a==='copy'){ const t=$('talk').textContent; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{ el.textContent='복사됨 ✓'; setTimeout(()=>{ el.textContent='복사하기'; },2000); }).catch(()=>{ el.textContent='길게 눌러 직접 복사해 주세요'; }); }
  else if(el.dataset.a==='seed') seedData();
  else if(el.dataset.a==='clearseed') clearSeed();
